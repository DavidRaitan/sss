<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>חברותא</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <span class="brand">חברותא</span>
  <div class="picker" role="group" aria-label="לאן לפתוח">
    <button class="btn flip" id="prev" title="העמוד הקודם (→)" aria-label="העמוד הקודם">›</button>
    <span class="pick"><label for="mas">מסכת</label><select id="mas" aria-label="מסכת"></select></span>
    <span class="pick"><label for="daf">דף</label><select id="daf" aria-label="דף"></select></span>
    <span class="pick"><label>עמוד</label>
      <span class="seg2" role="group" aria-label="עמוד">
        <button class="btn" id="am-a" aria-pressed="true">א</button>
        <button class="btn" id="am-b" aria-pressed="false">ב</button>
      </span></span>
    <button class="btn flip" id="next" title="העמוד הבא (←)" aria-label="העמוד הבא">‹</button>
    <button class="btn today" id="today" title="הדף היומי" aria-label="הדף היומי">📅 <span id="today-label">הדף היומי</span></button>
  </div>
  <span class="grow"></span>
  <span class="seg2 hide-narrow" role="group" aria-label="תצוגה">
    <button class="btn" id="v-daf" aria-pressed="true" title="כמו בגמרא: רש״י ותוספות מסביב">צורת הדף</button>
    <button class="btn" id="v-lin" aria-pressed="false" title="מנוקד ומפוסק, עם תרגום">שטיינזלץ</button>
  </span>
  <span class="status" id="status" title=""><span class="dot" id="dot"></span><span id="statustext"></span></span>
  <button class="btn icon" id="open-settings" title="הגדרות" aria-label="הגדרות">⚙︎</button>
</header>

<main>
  <div class="sheet">
    <div class="runner"><span id="runner">…</span><span class="where" id="where"></span></div>
    <div id="page" class="daf aleph" hidden>
      <section class="col inner" id="col-inner" aria-label="רש״י"></section>
      <section class="col gemara" id="col-gemara" aria-label="גמרא"><div class="gtext" id="gtext"></div></section>
      <section class="col outer" id="col-outer" aria-label="תוספות"></section>
    </div>
    <div id="linear" class="linear" hidden></div>
    <div id="loading" class="loading">פותח את הדף…</div>
  </div>
  <section class="desk" id="desk" hidden aria-label="שולחן: מפרשים לקרוא לצד הדף">
    <div class="desk-grip" id="desk-grip" role="separator" title="גרור כדי לשנות את הגודל"></div>
    <div class="desk-bar">
      <span class="desk-title">שולחן</span>
      <button class="btn" id="desk-add" aria-expanded="false">＋ מפרש</button>
      <span class="grow"></span>
      <span class="seg2 small" role="group" aria-label="איפה השולחן">
        <button class="btn" id="desk-side" title="לצד הדף">בצד</button>
        <button class="btn" id="desk-below" title="מתחת לדף">למטה</button>
        <button class="btn" id="desk-full" title="רק השולחן, בלי הדף">מלא</button>
      </span>
      <button class="btn icon" id="desk-swap" title="להחליף צד">⇄</button>
      <button class="btn icon" id="desk-smaller" title="אותיות קטנות יותר">א−</button>
      <button class="btn icon" id="desk-bigger" title="אותיות גדולות יותר">א+</button>
      <button class="btn icon" id="desk-close" title="לסגור את השולחן">✕</button>
    </div>
    <div class="desk-layouts" id="desk-layouts"></div>
    <div class="desk-pick" id="desk-pick" hidden></div>
    <div class="desk-cards" id="desk-cards"></div>
  </section>
</main>

<footer>
  <div class="bar">
    <div class="micwrap">
      <span class="level" id="level"></span>
      <button id="mic" data-state="idle" title="מיקרופון: לפתוח / לסגור" aria-label="מיקרופון">🎙</button>
      <button id="hold" class="hold" hidden title="לעצור (רווח)" aria-label="לעצור את הדיבור">⏸</button>
    </div>
    <div class="talk" id="talk" aria-live="polite">
      <div class="state" id="state">לחץ על המיקרופון — וקרא, או תגיד מה אתה חושב שכתוב.</div>
      <div class="mine" id="mine" dir="auto" hidden></div>
      <div class="asked" id="asked" dir="auto" hidden></div>
      <div class="reply" id="reply" dir="auto" hidden></div>
      <div class="chips" id="chips"></div>
      <div class="queue" id="queue" hidden></div>
    </div>
    <div class="tools">
      <button class="btn" id="open-sources">מפרשים</button>
      <button class="btn" id="open-desk" aria-pressed="false" title="מפרשים לצד הדף, לקריאה">שולחן</button>
      <button class="btn" id="open-log">תמליל</button>
    </div>
  </div>
</footer>

<aside class="over" id="over">
  <div class="grip" id="grip" title="גרור כדי להגדיל או להקטין" aria-label="גודל החלונית" role="separator"></div>
  <button class="btn close" id="close-panel" title="סגור (Esc)" aria-label="סגור">✕</button>
  <div class="panel" id="panel" role="complementary"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
