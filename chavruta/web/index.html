<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חברותא</title>
<style>
  :root {
    --ink:#1a1614; --dim:#6b625c; --faint:#a09890;
    --ground:#faf7f2; --card:#fff; --line:#e5ded4;
    --mark:#b4472f; --glow:#fdf3d8; --me:#eef2f6;
    --serif:"SBL Hebrew","Taamey Frank CLM","Times New Roman",serif;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#ece6de; --dim:#9a9088; --faint:#6b625c; --ground:#16130f;
            --card:#1e1a16; --line:#332c25; --mark:#e08a6d; --glow:#2b2317; --me:#232b33; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--ui); }
  header { position:sticky; top:0; z-index:5; display:flex; gap:9px; align-items:center;
    padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { margin:0 6px 0 0; font-size:15px; font-weight:600; }
  input, select, button { font:inherit; font-size:13px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); border-radius:6px; padding:5px 10px; }
  input { width:230px; }
  .lbl { font-size:12px; color:var(--faint); }
  .find { position:relative; }
  #hits { position:absolute; top:100%; inset-inline-start:0; z-index:20; min-width:230px;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    margin-top:4px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.11); }
  #hits div { padding:7px 11px; font-size:13px; cursor:pointer; direction:ltr; text-align:left; }
  #hits div:hover, #hits div.on { background:var(--glow); }
  .where { font-size:11.5px; color:var(--faint); margin:0 0 9px; }
  button { cursor:pointer; color:var(--dim); }
  button:hover { color:var(--ink); border-color:var(--faint); }
  button[aria-pressed="true"], button.go { color:#fff; background:var(--ink); border-color:var(--ink); }
  .grow { flex:1; }
  .note { width:100%; font-size:12px; color:var(--mark); }
  .note.busy { color:var(--dim); }

  main { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:20px;
    max-width:1240px; margin:0 auto; padding:20px 16px 40px; align-items:start; }
  @media (max-width:920px) { main { grid-template-columns:minmax(0,1fr); } }

  .seg { background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:14px 17px; margin-bottom:10px; cursor:pointer; }
  .seg:hover { border-color:var(--faint); }
  .seg[aria-current="true"] { border-color:var(--mark); box-shadow:0 0 0 1px var(--mark); }
  .n { font-size:11px; color:var(--faint); margin-bottom:6px; display:flex; gap:8px; }
  .he { font-family:var(--serif); font-size:24px; line-height:1.95; }
  .stops .cl:nth-child(odd) { background:var(--glow); border-radius:3px; padding:0 2px; }
  .en { margin-top:10px; font-size:14px; line-height:1.6; color:var(--dim);
    direction:ltr; text-align:left; }
  .en .add { color:var(--faint); font-style:italic; }
  .tags { display:flex; gap:5px; flex-wrap:wrap; margin-inline-start:auto; }
  .tag { font-size:10px; color:var(--dim); background:var(--ground);
    border:1px solid var(--line); border-radius:20px; padding:1px 7px; }

  aside { position:sticky; top:64px; background:var(--card); border:1px solid var(--line);
    border-radius:9px; display:flex; flex-direction:column; max-height:calc(100vh - 86px); }
  @media (max-width:920px) { aside { position:static; max-height:none; } }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { border:0; border-radius:0; background:none; padding:10px 14px; font-size:13px; }
  .tabs button[aria-selected="true"] { color:var(--ink); box-shadow:inset 0 -2px 0 var(--mark); }
  .pane { overflow-y:auto; padding:14px 16px; flex:1; min-height:280px; }
  .pane[hidden] { display:none; }

  .msg { margin-bottom:13px; font-size:14.5px; line-height:1.62; white-space:pre-wrap; }
  .msg.me { background:var(--me); border-radius:9px; padding:8px 11px; }
  .msg.warn { color:var(--mark); font-size:12px; }
  .msg .trace { display:block; font-size:10.5px; color:var(--faint); margin-top:5px; direction:ltr; }
  .ask { display:flex; gap:7px; border-top:1px solid var(--line); padding:10px; }
  .ask input { flex:1; width:auto; }
  #mic { font-size:15px; padding:5px 9px; }
  #mic[aria-pressed="true"] { background:var(--mark); border-color:var(--mark); color:#fff; }
  @keyframes pulse { 50% { opacity:.55; } }
  #mic[aria-pressed="true"] { animation:pulse 1.1s ease-in-out infinite; }

  .grp { font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint);
    margin:14px 0 7px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  .src { margin-bottom:12px; }
  .src .who { font-size:12.5px; font-weight:600; }
  .src .dib { font-family:var(--serif); font-size:15px; color:var(--mark); }
  .src .body { font-family:var(--serif); font-size:16px; line-height:1.78; margin-top:4px;
    max-height:5.2em; overflow:hidden; }
  .src.open .body { max-height:none; }
  .more { border:0; padding:2px 0; font-size:11.5px; background:none; }
  .shape { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
  .mv { font-size:10px; border-radius:3px; padding:1px 6px; border:1px solid var(--line); color:var(--dim); }
  .mv.difficulty { color:var(--mark); border-color:var(--mark); }
  .ref { font-size:10.5px; color:var(--faint); direction:ltr; margin-top:4px; }
  .lnk { display:block; font-size:12px; color:var(--dim); direction:ltr; text-align:left;
    padding:2px 0; text-decoration:none; }
  .lnk:hover { color:var(--mark); }
</style>
</head>
<body>
<header>
  <h1>חברותא</h1>
  <div class="find">
    <input id="ref" placeholder="ברכות ב · berachot 2 · bava metzia 59"
           value="Berakhot 2a" aria-label="find a daf" autocomplete="off">
    <div id="hits" hidden></div>
  </div>
  <button id="prev" title="previous amud">‹</button>
  <button id="next" title="next amud">›</button>
  <label class="lbl">רמה</label>
  <select id="level" aria-label="level">
    <option value="standard">רגיל — Rashi &amp; Tosafot</option>
    <option value="beginner">מתחיל — lean on English</option>
    <option value="fluent">שוטף — no translation</option>
  </select>
  <select id="stt" aria-label="how to listen">
    <option value="browser">שמיעה: דפדפן (חינם)</option>
    <option value="api">שמיעה: API (מעורב שפות)</option>
  </select>
  <select id="lang" aria-label="spoken language">
    <option value="he-IL">מדבר עברית</option>
    <option value="en-US">speaking English</option>
  </select>
  <button id="speak" aria-pressed="true" title="speak replies aloud (never the gemara)">🔊</button>
  <button id="stops" aria-pressed="false">עצירות</button>
  <button id="eng" aria-pressed="false">English</button>
  <span class="grow"></span>
  <span class="note" id="note" hidden></span>
</header>
<main>
  <div><p class="where" id="where"></p><div id="daf"></div></div>
  <aside>
    <div class="tabs" role="tablist">
      <button id="t-chat" role="tab" aria-selected="true" aria-controls="p-chat">
        שיחה · talk</button>
      <button id="t-src" role="tab" aria-selected="false" aria-controls="p-src">
        מפרשים · sources</button>
    </div>
    <div class="pane" id="p-chat" role="tabpanel"></div>
    <div class="pane" id="p-src" role="tabpanel" hidden></div>
    <form class="ask" id="ask">
      <button type="button" id="mic" title="click to talk, click again to send">🎤</button>
      <input id="say" placeholder="say what you think it means…" autocomplete="off">
      <button type="submit">→</button>
    </form>
  </aside>
</main>
<script>
const ORDER = ["Commentary","Halakhah","Talmud","Tanakh","Midrash","Responsa"];
let pack = null, line = 1;
const session = sessionStorage.getItem("chav") ||
  (sessionStorage.setItem("chav", Math.random().toString(36).slice(2)),
   sessionStorage.getItem("chav"));

const el = (t,c,x)=>{const n=document.createElement(t);
  if(c)n.className=c; if(x!==undefined)n.textContent=x; return n;};
const $ = id => document.getElementById(id);

function note(text, busy) {
  const n = $("note");
  n.hidden = !text; n.textContent = text || ""; n.classList.toggle("busy", !!busy);
}

async function openDaf(ref) {
  note("fetching " + ref + " from Sefaria…", true);
  try {
    const r = await fetch("/api/daf?ref=" + encodeURIComponent(ref));
    const data = await r.json();
    if (!r.ok) { note(data.error || "could not open that daf"); return; }
    pack = data; line = pack.segments[0]?.n || 1;
    $("where").textContent = pack.ref + " — " + pack.segments.length +
      " lines on this amud. Click a line to talk about it.";
    note(pack.fixture ? pack.fixture_note : "");
    drawDaf(); select(line); $("p-chat").replaceChildren();
    say_system("Open at " + pack.ref + ". Read a line, then tell me what you think it means.");
  } catch (e) { note("could not reach the server"); }
}

function drawDaf() {
  const daf = $("daf"); daf.replaceChildren();
  for (const seg of pack.segments) {
    const box = el("div","seg"); box.dataset.n = seg.n;
    const head = el("div","n"); head.append(el("span",null,seg.ref));
    const tags = el("div","tags");
    for (const [c,k] of Object.entries(seg.panel||{})) tags.append(el("span","tag",c+" "+k));
    head.append(tags);
    const he = el("div","he");
    for (const c of (seg.clauses?.length ? seg.clauses : [{he:seg.he}]))
      he.append(el("span","cl", c.he + " "));
    const en = el("div","en"); en.hidden = $("eng").getAttribute("aria-pressed") !== "true";
    for (const s of seg.en||[]) en.append(el("span", s.kind==="daf"?"lit":"add", s.text+" "));
    box.append(head, he, en);
    box.onclick = () => select(seg.n);
    daf.append(box);
  }
  daf.classList.toggle("stops", $("stops").getAttribute("aria-pressed")==="true");
}

function select(n) {
  line = n;
  for (const b of document.querySelectorAll(".seg"))
    b.setAttribute("aria-current", String(+b.dataset.n === n));
  $("where").textContent = pack.ref + " — line " + n + " of " + pack.segments.length +
    ". The chavruta answers about this line.";
  const seg = pack.segments.find(s => s.n === n), pane = $("p-src");
  pane.replaceChildren();
  const rows = [];
  for (const [who,list] of Object.entries(seg.commentaries||{}))
    for (const e of list) rows.push([who,e]);
  rows.sort((a,b)=>(b[1].weight||0)-(a[1].weight||0));
  if (rows.length) pane.append(el("div","grp","Commentary"));
  for (const [who,e] of rows) {
    const box = el("div","src");
    const head = el("div","who",who);
    if (e.dibur) { head.append(" "); head.append(el("span","dib",e.dibur)); }
    box.append(head, el("div","body",e.he));
    const shape = el("div","shape");
    for (const m of (e.structure? e.structure.moves : []))
      shape.append(el("span","mv "+m.kind, m.marker));
    if (shape.children.length) box.append(shape);
    box.append(el("div","ref",e.ref));
    const more = el("button","more","הצג הכל");
    more.onclick = ev => { ev.stopPropagation(); box.classList.toggle("open");
      more.textContent = box.classList.contains("open") ? "הצג פחות" : "הצג הכל"; };
    box.append(more); pane.append(box);
  }
  for (const [label,refs] of [["Halakhah",seg.halacha],["Talmud",seg.xrefs]]) {
    if (!refs?.length) continue;
    pane.append(el("div","grp",label));
    for (const r of refs) {
      const a = el("a","lnk",r);
      a.href = "https://www.sefaria.org/" + encodeURIComponent(r.replace(/ /g,"_"));
      a.target="_blank"; a.rel="noopener"; pane.append(a);
    }
  }
}

function bubble(cls, text, trace) {
  const m = el("div","msg "+cls, text);
  if (trace) m.append(el("span","trace",
    "routed: " + trace.kind + (trace.claim ? " (claim)" : "") +
    " · opened: " + (trace.opened||[]).join(", ")));
  const pane = $("p-chat"); pane.append(m); pane.scrollTop = pane.scrollHeight;
  return m;
}
const say_system = t => bubble("warn", t);

$("ask").onsubmit = async ev => {
  ev.preventDefault();
  const box = $("say"), said = box.value.trim();
  if (!said || !pack) return;
  box.value = ""; bubble("me", said);
  const pending = bubble("", "…");
  try {
    const r = await fetch("/api/say", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ref: pack.ref, line, said, session, level: $("level").value})});
    const data = await r.json();
    pending.remove();
    if (!r.ok) return void bubble("warn", data.error || "something went wrong");
    bubble("", data.text, data.trace);
    speak(data.text);
    if (!data.grounded) bubble("warn", "ungrounded: " + data.problem);
  } catch (e) { pending.remove(); bubble("warn","could not reach the server"); }
};

for (const [tab, pane] of [["t-chat","p-chat"],["t-src","p-src"]]) {
  $(tab).onclick = () => {
    for (const [t,p] of [["t-chat","p-chat"],["t-src","p-src"]]) {
      const on = t === tab;
      $(t).setAttribute("aria-selected", String(on)); $(p).hidden = !on;
    }
  };
}
const toggle = (id, apply) => { const b = $(id);
  b.onclick = () => { const on = b.getAttribute("aria-pressed")!=="true";
    b.setAttribute("aria-pressed", String(on)); apply(on); }; };
toggle("stops", on => $("daf").classList.toggle("stops", on));
toggle("eng", on => document.querySelectorAll(".en").forEach(e => e.hidden = !on));



/* ---- finding and moving between dapim ---------------------------------- */

// "Berakhot 2a" -> "Berakhot 2b" -> "Berakhot 3a". An amud, not a page.
function step(ref, by) {
  const m = /^(.*?)(\d+)([ab])$/.exec(ref.trim());
  if (!m) return null;
  let [, book, num, side] = m;
  num = parseInt(num, 10);
  if (by > 0) { if (side === "a") side = "b"; else { side = "a"; num++; } }
  else { if (side === "b") side = "a"; else { side = "b"; num--; } }
  return num < 2 ? null : book + num + side;
}

let hitIndex = -1;
function showHits(list) {
  const box = $("hits");
  box.replaceChildren(); hitIndex = -1;
  if (!list.length) { box.hidden = true; return; }
  list.forEach(name => {
    const row = el("div", null, name);
    row.onmousedown = ev => { ev.preventDefault(); $("ref").value = name;
      box.hidden = true; openDaf(name); };
    box.append(row);
  });
  box.hidden = false;
}

let findTimer = null;
$("ref").oninput = () => {
  clearTimeout(findTimer);
  const q = $("ref").value.trim();
  findTimer = setTimeout(async () => {
    if (q.length < 2) return void showHits([]);
    try {
      const r = await fetch("/api/find?q=" + encodeURIComponent(q));
      const d = await r.json();
      showHits(d.matches || []);
    } catch (e) { showHits([]); }
  }, 220);
};
$("ref").onkeydown = ev => {
  const box = $("hits"), rows = [...box.querySelectorAll("div")];
  if (!box.hidden && rows.length && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
    ev.preventDefault();
    hitIndex = (hitIndex + (ev.key === "ArrowDown" ? 1 : -1) + rows.length) % rows.length;
    rows.forEach((r, i) => r.classList.toggle("on", i === hitIndex));
    return;
  }
  if (ev.key === "Enter") {
    ev.preventDefault();
    const pick = hitIndex >= 0 && rows[hitIndex] ? rows[hitIndex].textContent : $("ref").value.trim();
    $("ref").value = pick; box.hidden = true; openDaf(pick);
  }
  if (ev.key === "Escape") box.hidden = true;
};
$("ref").onblur = () => setTimeout(() => { $("hits").hidden = true; }, 150);

function go(by) {
  if (!pack) return;
  const next = step(pack.ref, by);
  if (next) { $("ref").value = next; openDaf(next); }
}
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
document.addEventListener("keydown", ev => {
  if (document.activeElement.tagName === "INPUT") return;
  if (ev.key === "ArrowLeft") go(1);        // RTL: left is forward
  if (ev.key === "ArrowRight") go(-1);
});

/* ---- voice -------------------------------------------------------------
   Two ways to listen. The browser's recogniser is free and instant but
   handles one language at a time, which is wrong for a sentence that starts
   in English and lands in Aramaic. The API path costs a little and copes with
   that. Both feed the same box, so you can switch mid-session and feel the
   difference -- which is the ASR question this project has to answer anyway.

   Replies are spoken, the gemara is never spoken. Synthesised Aramaic sounds
   wrong to exactly the people whose ear is trained enough to matter, and
   reading it aloud is the learning act being protected -- so Hebrew-script
   runs are stripped before anything reaches the synthesiser. You read the
   text; it talks about it.                                                */

const HEBREW = /[\u0590-\u05FF]+(?:[\s\u0590-\u05FF"'\u05f3\u05f4.,:;?!-]*[\u0590-\u05FF]+)*/g;
let recog = null, listening = false, recorder = null, chunks = [];

function speakable(text) {
  return text.replace(HEBREW, " — ").replace(/\[\[[^\]]+\]\]/g, "")
             .replace(/\s{2,}/g, " ").replace(/(\s—\s){2,}/g, " — ").trim();
}

function speak(text) {
  if ($("speak").getAttribute("aria-pressed") !== "true") return;
  if (!window.speechSynthesis) return;
  const say = speakable(text);
  if (!say) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(say);
  u.lang = "en-US"; u.rate = 1.02;
  speechSynthesis.speak(u);
}

function micState(on) {
  listening = on;
  $("mic").setAttribute("aria-pressed", String(on));
}

function startBrowser() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) { note("this browser cannot listen — switch שמיעה to API"); return; }
  recog = new Rec();
  recog.lang = $("lang").value;
  recog.continuous = true;
  recog.interimResults = true;
  let settled = "";
  recog.onresult = ev => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) settled += r[0].transcript + " "; else interim += r[0].transcript;
    }
    $("say").value = (settled + interim).trim();
  };
  recog.onerror = ev => { note("listening stopped: " + ev.error); micState(false); };
  recog.onend = () => { if (listening) { try { recog.start(); } catch (e) {} } };
  recog.start();
  micState(true);
}

async function startApi() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recorder = new MediaRecorder(stream); chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type: "audio/webm"});
      if (blob.size < 1200) return;
      note("transcribing…", true);
      try {
        const r = await fetch("/api/transcribe", {method:"POST",
          headers:{"Content-Type":"application/octet-stream"}, body: blob});
        const data = await r.json();
        note(data.error || "");
        if (data.text) { $("say").value = data.text; $("ask").requestSubmit(); }
      } catch (e) { note("could not transcribe"); }
    };
    recorder.start(); micState(true);
  } catch (e) { note("no microphone access"); micState(false); }
}

function stopListening() {
  micState(false);
  if (recog) { try { recog.stop(); } catch (e) {} recog = null; }
  if (recorder && recorder.state !== "inactive") recorder.stop();
  recorder = null;
}

$("mic").onclick = () => {
  if (listening) {
    stopListening();
    // The browser recogniser fills the box as you speak, so send what is there.
    if ($("stt").value === "browser" && $("say").value.trim()) $("ask").requestSubmit();
    return;
  }
  if (speechSynthesis) speechSynthesis.cancel();   // do not talk over the learner
  ($("stt").value === "api" ? startApi : startBrowser)();
};
$("stt").onchange = () => { if (listening) stopListening(); };
$("lang").onchange = () => { if (listening && recog) { stopListening(); startBrowser(); } };
$("speak").onclick = () => {
  const on = $("speak").getAttribute("aria-pressed") !== "true";
  $("speak").setAttribute("aria-pressed", String(on));
  if (!on && window.speechSynthesis) speechSynthesis.cancel();
};

openDaf($("ref").value);
</script>
</body>
</html>
