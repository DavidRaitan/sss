<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>חברותא</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="חברותא">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&family=Assistant:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- One set of line icons, drawn like the type around them. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M15 9.5V6a3 3 0 0 0-5.6-1.5M9 9v2.5a3 3 0 0 0 4.6 2.5M5.5 11.5a6.5 6.5 0 0 0 10.4 5.2M18.4 13.2a6.5 6.5 0 0 0 .1-1.7M12 18v3M4 4l16 16"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 6.2v11.6L18 12z"/></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6.5 6.5v11L14.5 12zM17.5 6.5v11"/></symbol>
  <symbol id="i-latest" viewBox="0 0 24 24"><path d="M4 7v10l6-5zM11 7v10l6-5zM19.5 6.5v11"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4.5 9.5h3L12 6v12l-4.5-3.5h-3zM15.5 9.2a4 4 0 0 1 0 5.6M18 6.7a7.5 7.5 0 0 1 0 10.6"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7.5h9M18 7.5h2M4 16.5h2M11 16.5h9"/><circle cx="15.5" cy="7.5" r="2.3"/><circle cx="8.5" cy="16.5" r="2.3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4 4 9-9"/></symbol>
  <symbol id="i-wait" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 8v4.3l2.8 1.8"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7c-2-1.5-5-2-7.5-1.5v12.5c2.5-.5 5.5 0 7.5 1.5 2-1.5 5-2 7.5-1.5V5.5C17 5 14 5.5 12 7zM12 7v12.5"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4h8.5L18 7.5V20H6zM14 4v4h4M9 12.5h6M9 16h4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4.5l2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 16.3l-4.6 2.5.9-5.2-3.8-3.6 5.2-.7z"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M5 8.5h13.5l-3-3M19 15.5H5.5l3 3"/></symbol>
  <symbol id="i-desk" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M10 5v14"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M9.5 6.5L15 12l-5.5 5.5"/></symbol>
  <symbol id="i-wide" viewBox="0 0 24 24"><path d="M4 12h16M7.5 8.5L4 12l3.5 3.5M16.5 8.5L20 12l-3.5 3.5"/></symbol>
  <symbol id="i-narrow" viewBox="0 0 24 24"><path d="M3 12h6.5M14.5 12H21M6.5 8.5L10 12l-3.5 3.5M17.5 8.5L14 12l3.5 3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5.5 5.5h13a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H11l-4.5 3.5V17h-1a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2zM8 10h8M8 13h5"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M2.5 18.5L7.5 5.5l5 13M4.4 14h6.2M13.5 18.5l3.5-8.5 3.5 8.5M14.7 15.7h4.6"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6.5h.01M15 6.5h.01M9 12h.01M15 12h.01M9 17.5h.01M15 17.5h.01"/></symbol>
</svg>

<header>
  <span class="brand">חברותא</span>
  <!-- On a phone the bar is one line: the page you are on (tap to turn to another), and its two sides. -->
  <button class="m-title" id="m-title" aria-haspopup="dialog" aria-controls="picker" aria-label="לבחור דף"><span id="m-title-text">…</span><svg class="ic"><use href="#i-down"/></svg></button>
  <span class="seg2 m-amud" role="group" aria-label="עמוד">
    <button class="btn" id="m-am-a" aria-pressed="true">א</button>
    <button class="btn" id="m-am-b" aria-pressed="false">ב</button>
  </span>
  <div class="picker" id="picker" role="group" aria-label="לאן לפתוח">
    <div class="pick-head"><span class="pick-title">לפתוח דף</span><button class="pick-done" id="pick-done">סיום</button></div>
    <span class="pick"><label for="mas">מסכת</label><select id="mas" aria-label="מסכת"></select></span>
    <span class="pick"><label for="daf">דף</label><select id="daf" aria-label="דף"></select></span>
    <span class="pick"><label>עמוד</label>
      <span class="seg2" role="group" aria-label="עמוד">
        <button class="btn" id="am-a" aria-pressed="true">א</button>
        <button class="btn" id="am-b" aria-pressed="false">ב</button>
      </span></span>
    <button class="btn today" id="today" title="הדף היומי" aria-label="הדף היומי"><svg class="ic"><use href="#i-calendar"/></svg><span id="today-label">הדף היומי</span></button>
  </div>
  <span class="grow"></span>
  <span class="seg2 hide-narrow" role="group" aria-label="תצוגה">
    <button class="btn" id="v-daf" aria-pressed="true" title="כמו בגמרא: רש״י ותוספות מסביב">צורת הדף</button>
    <button class="btn" id="v-lin" aria-pressed="false" title="מנוקד ומפוסק, עם תרגום">שטיינזלץ</button>
    <button class="btn" id="v-img" aria-pressed="false" title="הדף כפי שנדפס (ש״ס וילנא)">מצולם</button>
  </span>
  <span class="status" id="status" title=""><span class="dot" id="dot"></span><span id="statustext"></span></span>
  <button class="btn icon" id="open-settings" title="הגדרות" aria-label="הגדרות"><svg class="ic"><use href="#i-settings"/></svg></button>
</header>

<div class="scrim" id="scrim"></div>

<main>
  <div class="sheet">
    <div class="runner"><span id="runner">…</span><span class="where" id="where"></span></div>
    <div id="page" class="daf aleph" hidden>
      <section class="col inner" id="col-inner" aria-label="רש״י"></section>
      <section class="col gemara" id="col-gemara" aria-label="גמרא"><div class="gtext" id="gtext"></div></section>
      <section class="col outer" id="col-outer" aria-label="תוספות"></section>
    </div>
    <div id="linear" class="linear" hidden></div>
    <!-- The page as printed: the Vilna Shas, scanned, opened by the browser itself from HebrewBooks, in the app's own colours. -->
    <div id="scan" class="scan" hidden>
      <div class="scan-sheet" id="scan-sheet"><iframe id="scan-frame" title="הדף המצולם" referrerpolicy="no-referrer"></iframe></div>
      <div class="scan-foot"><span>ש״ס וילנא · HebrewBooks</span><a id="scan-open" target="_blank" rel="noopener">לא מופיע? לפתוח שם ↗</a></div>
    </div>
    <div id="loading" class="loading">פותח את הדף…</div>
  </div>
  <section class="desk" id="desk" hidden aria-label="שולחן: מפרשים לקרוא לצד הדף">
    <div class="desk-grip" id="desk-grip" role="separator" title="גרור כדי לשנות את הגודל"></div>
    <div class="desk-bar">
      <span class="desk-title">שולחן</span>
      <button class="btn" id="desk-add" aria-expanded="false"><svg class="ic"><use href="#i-plus"/></svg>מפרש</button>
      <span class="grow"></span>
      <span class="seg2 small" role="group" aria-label="איפה השולחן">
        <button class="btn" id="desk-side" title="לצד הדף">בצד</button>
        <button class="btn" id="desk-below" title="מתחת לדף">למטה</button>
        <button class="btn" id="desk-full" title="רק השולחן, בלי הדף">מלא</button>
      </span>
      <button class="btn icon" id="desk-swap" title="להחליף צד" aria-label="להחליף צד"><svg class="ic"><use href="#i-swap"/></svg></button>
      <button class="btn icon" id="desk-smaller" title="אותיות קטנות יותר">א−</button>
      <button class="btn icon" id="desk-bigger" title="אותיות גדולות יותר">א+</button>
      <button class="btn icon" id="desk-close" title="לסגור את השולחן" aria-label="לסגור את השולחן"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="desk-layouts" id="desk-layouts"></div>
    <div class="desk-pick" id="desk-pick" hidden></div>
    <div class="desk-cards" id="desk-cards"></div>
  </section>
</main>

<footer id="foot">
  <div class="foot-grip" id="foot-grip" role="separator" aria-orientation="horizontal"
       aria-label="גודל אזור השיחה" title="גרור כדי להגדיל או להקטין · לחיצה כפולה מחזירה"></div>
  <div class="bar">
    <div class="micwrap">
      <span class="level" id="level"></span>
      <span class="ring" aria-hidden="true"></span>
      <button id="mic" data-state="idle" title="מיקרופון: לחיצה פותחת וסוגרת · לחיצה ארוכה עוצרת הכול" aria-label="מיקרופון" aria-pressed="false"><svg class="ic"><use href="#i-mic"/></svg></button>
      <button id="hold" class="hold" hidden title="לעצור (רווח)" aria-label="לעצור את הדיבור"><svg class="ic"><use href="#i-pause"/></svg></button>
      <button id="skipnow" class="hold skipnow" hidden title="לדלג על התשובה הזאת" aria-label="לדלג על התשובה הזאת"><svg class="ic"><use href="#i-skip"/></svg></button>
    </div>
    <div class="talkcol">
      <!-- On the phone, while it speaks: the answer's own controls, like a player's. -->
      <div class="player" id="player" hidden>
        <button class="p-btn" id="p-play" aria-label="לעצור"><svg class="ic"><use href="#i-pause"/></svg></button>
        <div class="p-what"><span class="p-state" id="p-state">מדבר</span><span class="p-asked" id="p-asked" dir="auto"></span></div>
        <button class="p-btn" id="p-skip" aria-label="לדלג על התשובה"><svg class="ic"><use href="#i-skip"/></svg></button>
      </div>
      <div class="talk-top">
        <div class="state" id="state">לחץ על המיקרופון — וקרא, או תגיד מה אתה חושב שכתוב.</div>
        <nav class="tabs" aria-label="חלוניות">
          <button class="tab" id="open-sources"><svg class="ic"><use href="#i-book"/></svg><span>מפרשים</span></button>
          <button class="tab" id="open-desk" aria-pressed="false" title="מפרשים לצד הדף, לקריאה"><svg class="ic"><use href="#i-desk"/></svg><span>שולחן</span></button>
          <button class="tab" id="open-log"><svg class="ic"><use href="#i-chat"/></svg><span>תמליל</span></button>
          <button class="tab" id="open-view" title="תצוגה וגודל אותיות"><svg class="ic"><use href="#i-type"/></svg><span>תצוגה</span></button>
          <button class="tab" id="open-settings-tab" title="הגדרות"><svg class="ic"><use href="#i-settings"/></svg><span>הגדרות</span></button>
        </nav>
      </div>
      <div class="talk" id="talk" aria-live="polite">
        <div class="mine" id="mine" dir="auto" hidden></div>
        <div class="asked" id="asked" dir="auto" hidden></div>
        <div class="reply" id="reply" dir="auto" hidden></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="queue" id="queue" hidden></div>
    </div>
  </div>
</footer>

<aside class="over" id="over">
  <div class="grip" id="grip" title="גרור כדי להגדיל או להקטין" aria-label="גודל החלונית" role="separator"></div>
  <button class="btn close" id="close-panel" title="סגור (Esc)" aria-label="סגור"><svg class="ic"><use href="#i-close"/></svg></button>
  <div class="panel" id="panel" role="complementary"></div>
</aside>

<script type="module" src="boot.js"></script>
</body>
</html>
