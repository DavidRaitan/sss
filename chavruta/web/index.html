<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חברותא</title>
<style>
  :root {
    --ink:#221c15; --dim:#6d6255; --faint:#a3988a;
    --page:#fdfaf3; --ground:#f2ece1; --line:#e0d7c7;
    --mark:#9c3b21; --glow:#f7e9c9; --edge:#cbbfa9;
    --serif:"SBL Hebrew","Taamey Frank CLM","Frank Ruehl CLM","Times New Roman",serif;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#eee6d8; --dim:#a2988a; --faint:#6f6558; --page:#1b1712;
            --ground:#13100c; --line:#332c22; --mark:#dd8a63; --glow:#33291a; --edge:#3d3427; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--ui);
    display:flex; flex-direction:column; }

  /* ---- the picker: masechta, daf, amud, like turning to a page ---- */
  header { display:flex; align-items:center; gap:10px; padding:9px 16px;
    background:var(--page); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { font-family:var(--serif); font-size:19px; letter-spacing:.02em; }
  .pick { display:flex; align-items:center; gap:6px; }
  .pick label { font-size:11px; color:var(--faint); }
  select, .btn { font:inherit; font-size:13px; color:var(--ink); background:var(--page);
    border:1px solid var(--line); border-radius:7px; padding:5px 9px; cursor:pointer; }
  select:hover, .btn:hover { border-color:var(--edge); }
  .amud { display:flex; }
  .amud .btn { border-radius:0; margin-inline-start:-1px; font-family:var(--serif); font-size:16px; padding:2px 13px; }
  .amud .btn:first-child { border-start-start-radius:7px; border-end-start-radius:7px; }
  .amud .btn:last-child { border-start-end-radius:7px; border-end-end-radius:7px; }
  .btn[aria-pressed="true"] { background:var(--ink); color:var(--page); border-color:var(--ink); }
  .grow { flex:1; }
  .quiet { font-size:12px; color:var(--faint); }

  /* ---- the daf ---- */
  main { flex:1; overflow-y:auto; }
  .sheet { max-width:760px; margin:0 auto; padding:26px 22px 40px; background:var(--page);
    min-height:100%; border-inline:1px solid var(--line); }
  .amudname { text-align:center; font-family:var(--serif); font-size:15px;
    color:var(--faint); letter-spacing:.06em; margin-bottom:20px; }
  .ln { position:relative; font-family:var(--serif); font-size:26px; line-height:2.05;
    padding:5px 14px 5px 10px; border-radius:6px; cursor:pointer; }
  .ln:hover { background:var(--ground); }
  .ln[aria-current="true"] { background:var(--glow); box-shadow:inset 3px 0 0 var(--mark); }
  .stops .cl:nth-child(even) { border-bottom:1px dotted var(--edge); }
  .ln .en { display:none; font-family:var(--ui); font-size:14px; line-height:1.6;
    color:var(--dim); direction:ltr; text-align:left; margin:6px 0 2px; }
  .showen .ln .en { display:block; }
  .ln .en .add { color:var(--faint); font-style:italic; }
  .hint { font-size:11px; color:var(--faint); margin-inline-start:6px; }

  /* ---- the voice bar: this is the conversation ---- */
  footer { background:var(--page); border-top:1px solid var(--line); padding:11px 16px 13px; }
  .bar { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  #mic { width:56px; height:56px; border-radius:50%; border:1px solid var(--edge);
    background:var(--page); font-size:22px; cursor:pointer; flex:none; }
  #mic[data-state="listening"] { background:var(--mark); border-color:var(--mark); color:#fff;
    animation:pulse 1.15s ease-in-out infinite; }
  #mic[data-state="thinking"] { background:var(--ink); border-color:var(--ink); color:var(--page); }
  #mic[data-state="speaking"] { background:var(--glow); border-color:var(--edge); }
  @keyframes pulse { 50% { box-shadow:0 0 0 9px rgba(156,59,33,.16); } }
  .said { flex:1; min-width:0; }
  .state { font-size:11.5px; color:var(--faint); letter-spacing:.04em; }
  .last { font-size:15px; line-height:1.5; margin-top:3px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .last.mine { color:var(--dim); font-style:italic; }
  .tools { display:flex; gap:7px; flex:none; }

  /* ---- transcript and sources slide over, they do not compete ---- */
  .sheetover { position:fixed; inset:0; background:rgba(0,0,0,.28); display:none; z-index:30; }
  .sheetover[data-open="true"] { display:block; }
  .panel { position:absolute; inset-block:0; inset-inline-start:0; width:min(430px,92vw);
    background:var(--page); border-inline-end:1px solid var(--line); overflow-y:auto; padding:18px 20px; }
  .panel h2 { margin:0 0 2px; font-size:14px; }
  .panel .sub { font-size:11.5px; color:var(--faint); margin-bottom:15px; }
  .close { position:absolute; top:12px; inset-inline-end:14px; }
  .grp { font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint);
    margin:15px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  .src { margin-bottom:13px; }
  .src .who { font-size:12.5px; font-weight:600; }
  .src .dib { font-family:var(--serif); font-size:15px; color:var(--mark); }
  .src .body { font-family:var(--serif); font-size:16.5px; line-height:1.8; margin-top:4px;
    max-height:5.4em; overflow:hidden; }
  .src.open .body { max-height:none; }
  .more { border:0; background:none; padding:2px 0; font-size:11.5px; color:var(--dim); cursor:pointer; }
  .shape { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
  .mv { font-size:10px; border-radius:3px; padding:1px 6px; border:1px solid var(--line); color:var(--dim); }
  .mv.difficulty { color:var(--mark); border-color:var(--mark); }
  .ref { font-size:10.5px; color:var(--faint); direction:ltr; margin-top:4px; }
  .lnk { display:block; font-size:12px; color:var(--dim); direction:ltr; text-align:left;
    padding:2px 0; text-decoration:none; }
  .lnk:hover { color:var(--mark); }
  .turn { margin-bottom:14px; font-size:14.5px; line-height:1.6; white-space:pre-wrap; }
  .turn.me { color:var(--dim); font-style:italic; }
  .turn .trace { display:block; font-size:10px; color:var(--faint); margin-top:4px; direction:ltr; }
</style>
</head>
<body>
<header>
  <span class="brand">חברותא</span>
  <span class="pick"><label for="mas">מסכת</label><select id="mas"></select></span>
  <span class="pick"><label for="daf">דף</label><select id="daf"></select></span>
  <span class="pick"><label>עמוד</label>
    <span class="amud"><button class="btn" id="am-a" aria-pressed="true">א</button>
    <button class="btn" id="am-b" aria-pressed="false">ב</button></span></span>
  <span class="grow"></span>
  <select id="level" aria-label="level">
    <option value="standard">רגיל</option>
    <option value="beginner">מתחיל</option>
    <option value="fluent">שוטף</option>
  </select>
  <button class="btn" id="eng" aria-pressed="false">תרגום</button>
  <button class="btn" id="stops" aria-pressed="false">עצירות</button>
  <span class="quiet" id="note"></span>
</header>

<main><div class="sheet" id="sheet">
  <div class="amudname" id="amudname">…</div>
  <div id="daftext"></div>
</div></main>

<footer><div class="bar">
  <button id="mic" data-state="idle" title="דבר">🎤</button>
  <div class="said">
    <div class="state" id="state">לחץ על המיקרופון ודבר</div>
    <div class="last" id="last"></div>
  </div>
  <div class="tools">
    <button class="btn" id="speak" aria-pressed="true" title="שהחברותא ידבר">🔊</button>
    <button class="btn" id="showsrc" title="מפרשים">מפרשים</button>
    <button class="btn" id="showlog" title="תמליל">תמליל</button>
  </div>
</div></footer>

<div class="sheetover" id="over" data-open="false">
  <div class="panel" id="panel"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c;
  if(x!==undefined)n.textContent=x; return n;};

let pack=null, line=1, masechtot=[], amud="a", history=[];
const session = sessionStorage.getItem("chav") ||
  (sessionStorage.setItem("chav", Math.random().toString(36).slice(2)),
   sessionStorage.getItem("chav"));

/* Hebrew numerals, because a daf is ב and not 2 — the small thing that makes
   this read as a gemara rather than a database row. */
const ONES=["","א","ב","ג","ד","ה","ו","ז","ח","ט"], TENS=["","י","כ","ל","מ","נ","ס","ע","פ","צ"];
function hebNum(n) {
  if (n === 15) return "טו";
  if (n === 16) return "טז";
  const h = Math.floor(n/100), t = Math.floor((n%100)/10), o = n%10;
  return (h===1?"ק":h===2?"ר":h===3?"ש":"") + TENS[t] + ONES[o];
}

function status(text, state) {
  $("state").textContent = text;
  if (state) $("mic").dataset.state = state;
}
function note(text) { $("note").textContent = text || ""; }

/* ---- picking a page ---------------------------------------------------- */

async function buildPickers() {
  try {
    const r = await fetch("/api/masechtot");
    masechtot = (await r.json()).masechtot || [];
  } catch (e) { masechtot = []; }
  const mas = $("mas");
  mas.replaceChildren();
  for (const m of masechtot) {
    const o = el("option", null, m.he); o.value = m.name; mas.append(o);
  }
  fillDapim();
  mas.onchange = () => { fillDapim(); turnTo(); };
  $("daf").onchange = turnTo;
}

function current() { return masechtot.find(m => m.name === $("mas").value) || masechtot[0]; }

function fillDapim() {
  const m = current(); if (!m) return;
  const daf = $("daf"); daf.replaceChildren();
  for (let n = m.first; n <= m.last; n++) {
    const o = el("option", null, hebNum(n)); o.value = n; daf.append(o);
  }
  daf.value = m.first;
}

function setAmud(which) {
  amud = which;
  $("am-a").setAttribute("aria-pressed", String(which === "a"));
  $("am-b").setAttribute("aria-pressed", String(which === "b"));
}
$("am-a").onclick = () => { setAmud("a"); turnTo(); };
$("am-b").onclick = () => { setAmud("b"); turnTo(); };

function turnTo() {
  const m = current(); if (!m) return;
  const n = parseInt($("daf").value, 10);
  // The last amud of a masechta may not have a second side.
  if (n === m.last && m.last_amud === "a" && amud === "b") setAmud("a");
  openDaf(m.name + " " + n + amud);
}

async function openDaf(ref) {
  note(""); status("פותח את הדף…", "thinking");
  $("amudname").textContent = ref;
  try {
    const r = await fetch("/api/daf?ref=" + encodeURIComponent(ref));
    const data = await r.json();
    if (!r.ok) {
      status("לא הצלחתי לפתוח את הדף", "idle");
      note(data.error ? "" : ""); console.warn(data.error);
      return;
    }
    pack = data; history = [];
    drawDaf(); select(pack.segments[0]?.n || 1);
    status("לחץ על המיקרופון ודבר", "idle");
    if (pack.fixture) note("נתוני בדיקה — לא הדף האמיתי");
  } catch (e) {
    status("אין חיבור לשרת", "idle"); console.warn(e);
  }
}

function drawDaf() {
  const m = current();
  const n = pack.ref.match(/(\d+)([ab])$/);
  $("amudname").textContent = (m ? m.he : pack.ref) +
    (n ? " · דף " + hebNum(+n[1]) + " עמוד " + (n[2] === "a" ? "א" : "ב") : "");
  const box = $("daftext"); box.replaceChildren();
  for (const seg of pack.segments) {
    const row = el("div", "ln"); row.dataset.n = seg.n;
    for (const c of (seg.clauses?.length ? seg.clauses : [{he: seg.he}]))
      row.append(el("span", "cl", c.he + " "));
    const en = el("div", "en");
    for (const s of seg.en || []) en.append(el("span", s.kind === "daf" ? "" : "add", s.text + " "));
    row.append(en);
    row.onclick = () => select(seg.n);
    box.append(row);
  }
}

function select(n) {
  line = n;
  for (const r of document.querySelectorAll(".ln"))
    r.setAttribute("aria-current", String(+r.dataset.n === n));
}

/* ---- talking ----------------------------------------------------------- */

/* Replies are spoken; the gemara is not. Synthesised Aramaic sounds wrong to
   exactly the ear that would notice, and reading it aloud is the learning act
   being protected — so Hebrew runs are stripped before the synthesiser. */
const HEBREW = /[֐-׿]+(?:[\s֐-׿"'׳״.,:;?!-]*[֐-׿]+)*/g;
const speakable = t => t.replace(HEBREW, " — ").replace(/\[\[[^\]]+\]\]/g, "")
  .replace(/\s{2,}/g, " ").replace(/(\s—\s){2,}/g, " — ").trim();

let handsFree = false;
function speak(text, then) {
  if ($("speak").getAttribute("aria-pressed") !== "true" || !window.speechSynthesis)
    return void (then && then());
  const say = speakable(text);
  if (!say) return void (then && then());
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(say);
  u.lang = "en-US"; u.rate = 1.03;
  u.onend = () => { status("לחץ על המיקרופון ודבר", "idle"); then && then(); };
  status("מדבר…", "speaking");
  speechSynthesis.speak(u);
}

async function send(said) {
  if (!said || !pack) return;
  history.push({role: "me", text: said});
  $("last").textContent = said; $("last").classList.add("mine");
  status("חושב…", "thinking");
  try {
    const r = await fetch("/api/say", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ref: pack.ref, line, said, session, level: $("level").value})});
    const data = await r.json();
    if (!r.ok) { status(data.error || "משהו השתבש", "idle"); console.warn(data.error); return; }
    history.push({role: "it", text: data.text, trace: data.trace});
    $("last").textContent = data.text; $("last").classList.remove("mine");
    // A conversation, not a chat: after it finishes talking, it listens again.
    speak(data.text, () => { if (handsFree) startListening(); });
  } catch (e) { status("אין חיבור לשרת", "idle"); console.warn(e); }
}

/* ---- listening --------------------------------------------------------- */

let recog = null, quiet = null, buffer = "";

function startListening() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) return void status("הדפדפן הזה לא יודע להאזין", "idle");
  if (window.speechSynthesis) speechSynthesis.cancel();
  recog = new Rec();
  // Bilingual by design: the sentence starts in English and lands in Aramaic.
  recog.lang = "he-IL";
  recog.continuous = true; recog.interimResults = true;
  buffer = "";
  recog.onresult = ev => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      if (res.isFinal) buffer += res[0].transcript + " "; else interim += res[0].transcript;
    }
    $("last").textContent = (buffer + interim).trim();
    $("last").classList.add("mine");
    // Silence ends the turn, the way it does between two people.
    clearTimeout(quiet);
    quiet = setTimeout(() => { if (buffer.trim()) stopListening(true); }, 1600);
  };
  recog.onerror = ev => {
    if (ev.error === "not-allowed") status("צריך גישה למיקרופון", "idle");
    else if (ev.error !== "no-speech") status("ההאזנה נפסקה", "idle");
    handsFree = false; recog = null;
  };
  recog.onend = () => { if (recog && $("mic").dataset.state === "listening") {
    try { recog.start(); } catch (e) {} } };
  try { recog.start(); } catch (e) {}
  handsFree = true;
  status("מקשיב… דבר, ואשתוק עד שתסיים", "listening");
}

function stopListening(andSend) {
  clearTimeout(quiet);
  const said = buffer.trim();
  const r = recog; recog = null;
  if (r) { try { r.stop(); } catch (e) {} }
  if (andSend && said) send(said);
  else { handsFree = false; status("לחץ על המיקרופון ודבר", "idle"); }
  buffer = "";
}

$("mic").onclick = () => {
  if ($("mic").dataset.state === "listening") stopListening(true);
  else { handsFree = true; startListening(); }
};
$("speak").onclick = () => {
  const on = $("speak").getAttribute("aria-pressed") !== "true";
  $("speak").setAttribute("aria-pressed", String(on));
  if (!on && window.speechSynthesis) speechSynthesis.cancel();
};

/* ---- what is behind the page ------------------------------------------- */

function openPanel(build) {
  const panel = $("panel"); panel.replaceChildren();
  const x = el("button", "btn close", "✕"); x.onclick = closePanel; panel.append(x);
  build(panel);
  $("over").dataset.open = "true";
}
const closePanel = () => { $("over").dataset.open = "false"; };
$("over").onclick = ev => { if (ev.target === $("over")) closePanel(); };
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closePanel(); });

$("showsrc").onclick = () => openPanel(panel => {
  const seg = pack?.segments.find(s => s.n === line);
  panel.append(el("h2", null, "מפרשים"),
               el("div", "sub", seg ? seg.ref : ""));
  if (!seg) return;
  const rows = [];
  for (const [who, list] of Object.entries(seg.commentaries || {}))
    for (const e of list) rows.push([who, e]);
  rows.sort((a, b) => (b[1].weight || 0) - (a[1].weight || 0));
  if (rows.length) panel.append(el("div", "grp", "על השורה הזאת"));
  for (const [who, e] of rows) {
    const box = el("div", "src");
    const head = el("div", "who", who);
    if (e.dibur) { head.append(" "); head.append(el("span", "dib", e.dibur)); }
    box.append(head, el("div", "body", e.he));
    const shape = el("div", "shape");
    for (const m of (e.structure ? e.structure.moves : []))
      shape.append(el("span", "mv " + m.kind, m.marker));
    if (shape.children.length) box.append(shape);
    box.append(el("div", "ref", e.ref));
    const more = el("button", "more", "עוד");
    more.onclick = () => { box.classList.toggle("open");
      more.textContent = box.classList.contains("open") ? "פחות" : "עוד"; };
    box.append(more); panel.append(box);
  }
  for (const [label, refs] of [["הלכה", seg.halacha], ["מקבילות", seg.xrefs]]) {
    if (!refs?.length) continue;
    panel.append(el("div", "grp", label));
    for (const r of refs) {
      const a = el("a", "lnk", r);
      a.href = "https://www.sefaria.org/" + encodeURIComponent(r.replace(/ /g, "_"));
      a.target = "_blank"; a.rel = "noopener"; panel.append(a);
    }
  }
});

$("showlog").onclick = () => openPanel(panel => {
  panel.append(el("h2", null, "תמליל"),
               el("div", "sub", "מה שנאמר עד כה"));
  if (!history.length) panel.append(el("div", "sub", "עוד לא דיברתם."));
  for (const t of history) {
    const row = el("div", "turn " + (t.role === "me" ? "me" : ""), t.text);
    if (t.trace) row.append(el("span", "trace",
      "routed: " + t.trace.kind + (t.trace.claim ? " (claim)" : "") +
      " · opened: " + (t.trace.opened || []).join(", ")));
    panel.append(row);
  }
});

const toggle = (id, apply) => { $(id).onclick = () => {
  const on = $(id).getAttribute("aria-pressed") !== "true";
  $(id).setAttribute("aria-pressed", String(on)); apply(on); }; };
toggle("eng", on => $("sheet").classList.toggle("showen", on));
toggle("stops", on => $("daftext").classList.toggle("stops", on));

buildPickers().then(turnTo);
</script>
</body>
</html>
