<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sara Nava &amp; Natan Yehuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Frank+Ruhl+Libre:wght@300;400;500&family=Gveret+Levin+AlefAlefAlef&display=swap" rel="stylesheet">
<style>
/* ————————————————————————————————————————————————
   Wedding invitation — one file, no build step.
   All wording lives in the T tables at the bottom of this file.
   ———————————————————————————————————————————————— */
:root{
  --ink:#2f2f2a;          /* body text */
  --ink-soft:#4a4a42;
  --olive:#5c6647;        /* the couple's names */
  --paper:#faf7f1;
  --card:1067px;          /* the artwork's natural width */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#e9e5db;
  font-family:'EB Garamond',Georgia,'Times New Roman',serif;
  color:var(--ink);
  -webkit-text-size-adjust:100%;
}
.card{
  max-width:var(--card);
  margin:0 auto;
  background-color:var(--paper);
  box-shadow:0 2px 40px rgba(60,55,40,.18);
  overflow:hidden;
  position:relative;
}
.art{display:block;width:100%;height:auto}

/* ——— the wording ——— */
.text{
  padding:0 8% 2.2em;
  text-align:center;
  /* the artwork's text block starts right under the branches */
  margin-top:-.4em;
}
.line{margin:0}
.verse{
  font-size:clamp(1.35rem,3.4vw,2.05rem);
  font-family:'Frank Ruhl Libre','EB Garamond',serif;
  font-weight:400;
  margin:0 0 .55em;
  color:var(--ink);
}
.intro .line{
  font-size:clamp(1.02rem,2.35vw,1.42rem);
  line-height:1.62;
  color:var(--ink-soft);
}
.names{
  font-family:'Great Vibes',cursive;
  color:var(--olive);
  font-size:clamp(2.5rem,7.4vw,4.6rem);
  line-height:1.15;
  margin:.42em 0 .5em;
  font-weight:400;
}
.when .line,.times .line{
  font-size:clamp(1.02rem,2.35vw,1.42rem);
  line-height:1.62;
}
.times{margin-top:1.45em}
.parents{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1.2em;
  margin-top:2.6em;
}
.parents .side{
  flex:1 1 0;
  font-size:clamp(.98rem,2.2vw,1.35rem);
  line-height:1.5;
}
.sprig{flex:0 0 auto;width:clamp(22px,3.2vw,40px);opacity:.92}
.sprig svg{display:block;width:100%;height:auto}

/* ——— Hebrew and the other right-to-left readings ——— */
[dir="rtl"] body,body[dir="rtl"]{}
.card[dir="rtl"] .intro .line,
.card[dir="rtl"] .when .line,
.card[dir="rtl"] .times .line,
.card[dir="rtl"] .parents .side,
.card[dir="rtl"] .verse{
  font-family:'Frank Ruhl Libre','David Libre',serif;
  font-weight:300;
}
.card[dir="rtl"] .names{
  font-family:'Gveret Levin AlefAlefAlef','Frank Ruhl Libre',cursive;
  font-size:clamp(2.2rem,6.4vw,4rem);
}

/* ——— language switcher ——— */
.langs{
  position:fixed;
  top:14px;
  inset-inline-end:14px;
  display:flex;
  gap:2px;
  padding:3px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(92,102,71,.28);
  border-radius:999px;
  backdrop-filter:blur(6px);
  z-index:5;
  font-family:'EB Garamond',serif;
}
.langs button{
  border:0;
  background:transparent;
  color:#5c6647;
  font:inherit;
  font-size:.92rem;
  letter-spacing:.04em;
  padding:.28em .78em;
  border-radius:999px;
  cursor:pointer;
}
.langs button[aria-current="true"]{background:#5c6647;color:#fff}
.langs:not(.multi){display:none}

.text{transition:opacity .28s ease}
.text.fading{opacity:0}

@media (max-width:640px){
  .text{padding:0 6% 2em}
  .parents{flex-direction:column;gap:1.4em;margin-top:2.1em}
  .sprig{order:-1}
}
@media print{
  body{background:#fff}
  .langs{display:none}
  .card{box-shadow:none;max-width:100%}
}
</style>
</head>
<body>

<nav class="langs" id="langs" aria-label="Language"></nav>

<main class="card" id="card" dir="ltr">
  <img class="art" id="artTop" alt="">

  <div class="text" id="text">
    <p class="verse" data-t="verse"></p>
    <div class="intro" data-t="intro"></div>
    <p class="names" data-t="names"></p>
    <div class="when" data-t="when"></div>
    <div class="times" data-t="times"></div>

    <div class="parents">
      <div class="side" data-t="parentsA"></div>
      <div class="sprig" aria-hidden="true">
        <svg viewBox="0 0 40 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 46V12" stroke="#6d7a52" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M20 22c-7 0-12-4-13-11 7-1 12 3 13 11Z" fill="#7f8f5c"/>
          <path d="M20 22c7 0 12-4 13-11-7-1-12 3-13 11Z" fill="#6d7a52"/>
          <path d="M20 12c-4 0-7-3-7-8 4 0 7 3 7 8Z" fill="#8a9a63"/>
          <path d="M20 12c4 0 7-3 7-8-4 0-7 3-7 8Z" fill="#6d7a52"/>
        </svg>
      </div>
      <div class="side" data-t="parentsB"></div>
    </div>
  </div>

  <img class="art" id="artBottom" alt="">
</main>

/* ————————————————————————————————————————————————
   2. SETTINGS
   ———————————————————————————————————————————————— */
const DEFAULT_LANG = "en";   // opens in this language when nothing else applies
const AUTO_DETECT  = true;   // ...unless the visitor's browser asks for another

/* ————————————————————————————————————————————————
   3. THE WORDING — one block per language.
      label   : what the switcher shows
      dir     : "ltr" or "rtl"
      title   : the browser tab
      Every other key is a line of the invitation. Use an array for
      several lines; set a key to "" to hide that part entirely.
   ———————————————————————————————————————————————— */
const T = {
  en: {
    label: "EN",
    dir: "ltr",
    title: "Sara Nava & Natan Yehuda",
    verse: "”מצאתי את שאהבה נפשי“",
    intro: [
      "With great pleasure and gratitude to Hashem",
      "we are delighted to invite you",
      "to join us in celebrating the marriage",
      "of our dear children"
    ],
    names: "Sara Nava &amp; Natan Yehuda",
    when: [
      "Which will take place on",
      "Thursday, October 29th 2026",
      "Psagot Winery"
    ],
    times: [
      "Kabbalat Panim at 18:00",
      "Chuppah at 18:45"
    ],
    parentsA: ["Aharon and Rivka Katsof"],
    parentsB: ["Shulamit Newman", "and Yoel Yativ"]
  },

  he: {
    label: "עב",
    dir: "rtl",
    title: "שרה נאוה ונתן יהודה",
    verse: "”מצאתי את שאהבה נפשי“",
    intro: [
      "הלב מלא שמחה והודיה לה' יתברך",
      "אנו מתכבדים להזמינכם להשתתף עמנו",
      "בשמחת נישואי ילדינו"
    ],
    names: "שרה נאוה &amp; נתן יהודה",
    when: [
      "שתתקיים אי”ה ביום חמישי י”ח בחשוון",
      "תשפ”ז (29.10.26) ביקב פסגות"
    ],
    times: [
      "קבלת פנים בשעה 18:00",
      "חופה 18:45"
    ],
    parentsA: ["אהרן ורבקה צוף"],
    parentsB: ["שולמית ניומן", "ויואל יטיב"]
  }
};

/* ————————————————————————————————————————————————
   4. The machinery. Nothing below needs editing.
   ———————————————————————————————————————————————— */
const card = document.getElementById("card");
const text = document.getElementById("text");

document.getElementById("artTop").src = ART.top;
document.getElementById("artBottom").src = ART.bottom;

function fill(el, value){
  if (value === "" || value == null){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  const lines = Array.isArray(value) ? value : [value];
  if (el.classList.contains("verse") || el.classList.contains("names")){
    el.innerHTML = lines.join("<br>");
  } else {
    el.innerHTML = lines.map(l => '<p class="line">' + l + "</p>").join("");
  }
}

function render(code, animate){
  const t = T[code];
  if (!t) return;
  const paint = () => {
    card.setAttribute("dir", t.dir);
    document.documentElement.lang = code;
    document.documentElement.dir = t.dir;
    document.title = t.title;
    text.querySelectorAll("[data-t]").forEach(el => fill(el, t[el.dataset.t]));
    document.querySelectorAll("#langs button").forEach(b =>
      b.setAttribute("aria-current", String(b.dataset.lang === code)));
    try { localStorage.setItem("invitation-lang", code); } catch (e) {}
    text.classList.remove("fading");
  };
  if (animate){ text.classList.add("fading"); setTimeout(paint, 280); }
  else paint();
}

function chooseLang(){
  const codes = Object.keys(T);
  const asked = new URLSearchParams(location.search).get("lang");
  if (asked && codes.includes(asked)) return asked;
  let saved = null;
  try { saved = localStorage.getItem("invitation-lang"); } catch (e) {}
  if (saved && codes.includes(saved)) return saved;
  if (AUTO_DETECT){
    for (const pref of (navigator.languages || [navigator.language || ""])){
      const hit = codes.find(c => pref.toLowerCase().startsWith(c));
      if (hit) return hit;
    }
  }
  return codes.includes(DEFAULT_LANG) ? DEFAULT_LANG : codes[0];
}

const nav = document.getElementById("langs");
const codes = Object.keys(T);
if (codes.length > 1){
  nav.classList.add("multi");
  for (const code of codes){
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.lang = code;
    b.textContent = T[code].label;
    b.addEventListener("click", () => render(code, true));
    nav.appendChild(b);
  }
}
render(chooseLang(), false);
</script>
