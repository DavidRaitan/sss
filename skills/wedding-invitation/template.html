<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COUPLE — RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=David+Libre:wght@400;500&family=Frank+Ruhl+Libre:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Taken from the invitation itself: its paper, its ink, the olive of the
     leaves and the peach of the chuppah drape. */
  :root{
    --ink:#332f22;
    --ink-soft:#5c5745;
    --sage:#7f8a5f;
    --sage-deep:#55603c;
    --gold:#c9a077;
    --paper:#f6f1e6;
    --line:#e2dbc8;
    --white:#fdfaf3;
    --shadow:0 18px 50px -22px rgba(74,64,42,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scrollbar-gutter:stable}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"EB Garamond",Georgia,serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body.rtl{direction:rtl}
  body.rtl .sec,body.rtl .submit,body.rtl .thanks h3{font-family:"Frank Ruhl Libre",serif}

  /* ---- botanical frame ---- */
  .leaves{position:fixed;pointer-events:none;z-index:0;opacity:.4}
  .leaves svg{display:block}
  .leaf-tl{top:-40px;left:-40px}
  .leaf-br{bottom:-50px;right:-45px;transform:rotate(180deg)}
  @media(max-width:640px){.leaves{opacity:.55;transform:scale(.7)}.leaf-tl{top:-70px;left:-70px}.leaf-br{bottom:-80px;right:-75px}}

  .wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:34px 20px 70px}

  /* ---- language switch ---- */
  .langbar{display:flex;justify-content:center;gap:6px;margin-bottom:28px;direction:ltr}
  .langbar button{
    font-family:"EB Garamond",serif;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    padding:7px 15px;border-radius:999px;cursor:pointer;transition:.25s;
  }
  .langbar button.on{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--white)}
  .langbar button:hover:not(.on){border-color:var(--sage);color:var(--sage-deep)}
  .langbar:not(.multi){display:none}

  /* ---- card ---- */
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:4px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;padding:0 0 40px;
  }
  .card-body{padding:0 40px;position:relative;isolation:isolate;overflow:hidden}
  @media(max-width:640px){.card-body{padding:0 22px}}

  /* ---- the invitation itself ---- */
  .invite-img{margin:0;line-height:0;background:var(--white);aspect-ratio:var(--invite-ratio,2/3)}
  .invite-img img{width:100%;height:100%;object-fit:contain;display:block}

  /* the language swap: one quiet crossfade, no jump */
  .invite-img img,.card-body{transition:opacity .22s ease}
  .card.swapping .invite-img img,.card.swapping .card-body{opacity:0}

  /* seam that blends the printed invitation into the interactive part */
  .fade-seam{position:relative;text-align:center;margin:0 0 22px}
  .fade-seam::before{
    content:"";position:absolute;left:0;right:0;top:-70px;height:70px;
    background:linear-gradient(to bottom, rgba(253,250,243,0), var(--white));
    pointer-events:none;
  }
  .fade-seam span{
    position:relative;display:inline-block;margin-top:14px;
    font-style:italic;color:var(--sage);font-size:1.02rem;letter-spacing:.02em;padding:0 14px;
  }
  .fade-seam span::before,.fade-seam span::after{
    content:"";position:absolute;top:50%;width:34px;height:1px;background:var(--line);
  }
  .fade-seam span::before{right:100%}
  .fade-seam span::after{left:100%}

  .facts{text-align:center;margin:24px auto 4px;max-width:420px}
  .facts p{font-size:1.05rem;color:var(--ink-soft);margin:3px 0}
  .facts .big{color:var(--ink);font-size:1.15rem;letter-spacing:.02em}

  .rule{width:56px;height:1px;background:var(--gold);margin:26px auto;opacity:.7}

  .times{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin:20px 0 6px}
  .times div{text-align:center}
  .times .lab{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin-bottom:2px}
  .times .val{font-family:"Cormorant Garamond",serif;font-size:1.7rem;color:var(--ink)}

  h2.sec{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.6rem;color:var(--sage-deep);text-align:center;margin:14px 0 4px}
  .sec-sub{text-align:center;color:var(--ink-soft);font-size:.98rem;margin-bottom:20px}

  /* ---- map ---- */
  .mapblock{margin-top:8px}
  .mapframe{border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:0 8px 24px -16px rgba(74,64,42,.45)}
  .mapframe iframe{display:block;width:100%;height:260px;border:0;filter:saturate(.92)}
  .maplink{display:inline-flex;align-items:center;gap:7px;margin-top:12px;color:var(--sage-deep);font-size:1rem;text-decoration:none;border-bottom:1px solid transparent;transition:.2s}
  .maplink:hover{border-bottom-color:var(--sage-deep)}
  .maplink svg{flex:none}
  .maprow{text-align:center}

  /* ---- form ---- */
  .field{margin-bottom:18px}
  .field label{display:block;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
  .field input,.field select{
    width:100%;font-family:"EB Garamond",serif;font-size:1.05rem;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:12px 14px;transition:.2s;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--sage);background:var(--white);box-shadow:0 0 0 3px rgba(127,138,95,.18)}

  .attend{display:flex;gap:12px}
  .attend label{flex:1;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:3px;padding:14px 8px;transition:.2s;background:var(--paper);font-size:1.05rem;color:var(--ink)}
  .attend input{position:absolute;opacity:0;pointer-events:none}
  .attend label.yes.on{border-color:var(--sage-deep);background:rgba(127,138,95,.16);color:var(--sage-deep);font-weight:600}
  .attend label.no.on{border-color:#c99a77;background:rgba(201,154,119,.15);color:#96684a;font-weight:600}

  .reveal{transition:.3s;overflow:hidden}
  .reveal.hide{max-height:0;opacity:0;margin:0}
  .reveal.show{max-height:420px;opacity:1}

  .submit{
    width:100%;font-family:"Cormorant Garamond",serif;font-size:1.3rem;letter-spacing:.03em;
    background:var(--sage-deep);color:var(--white);border:none;border-radius:3px;padding:15px;cursor:pointer;transition:.25s;margin-top:6px;
  }
  body.rtl .submit{font-size:1.1rem}
  .submit:hover{background:#454f2e}
  .submit:disabled{opacity:.6;cursor:wait}

  .msg{text-align:center;margin-top:16px;font-size:1.02rem;min-height:1.2em}
  .msg.ok{color:var(--sage-deep)}
  .msg.err{color:#a05a3c}

  .thanks{text-align:center;padding:20px 0 6px;display:none}
  .thanks.show{display:block}
  .thanks .mark{font-size:2.4rem;color:var(--gold);font-family:"Cormorant Garamond",serif}
  .thanks h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.7rem;color:var(--sage-deep);margin:6px 0}
  .thanks p{color:var(--ink-soft)}
  .thanks button{margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:9px 18px;border-radius:999px;cursor:pointer;font-family:"EB Garamond",serif;font-size:.9rem;transition:.2s}
  .thanks button:hover{border-color:var(--sage);color:var(--sage-deep)}

  .foot{text-align:center;color:var(--sage);font-style:italic;font-size:1rem;margin-top:30px}

  .credit{text-align:center;margin-top:42px}
  .credit-mark{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
  .credit-mark i{display:block;width:54px;height:1px;background:var(--line)}
  .credit-mark span{
    display:block;width:6px;height:6px;background:var(--gold);
    opacity:.8;transform:rotate(45deg);
  }
  .credit a{
    display:inline-flex;flex-direction:column;align-items:center;gap:6px;
    text-decoration:none;padding:4px 8px;transition:.25s;
  }
  .credit .lead{
    font-family:"EB Garamond",Georgia,serif;
    font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);transition:.25s;
  }
  .credit .brand{
    font-family:"Cormorant Garamond",serif;font-size:1.72rem;font-weight:500;
    letter-spacing:.16em;color:var(--sage-deep);
    padding-bottom:4px;border-bottom:1px solid transparent;transition:.25s;
  }
  .credit a:hover .brand{border-bottom-color:var(--gold)}
  .credit a:focus-visible{
    outline:2px solid var(--sage-deep);outline-offset:4px;border-radius:3px;
  }
  body.rtl .credit .lead{letter-spacing:.08em}
  body.rtl .credit .brand{font-family:"Frank Ruhl Libre",serif;letter-spacing:.05em;font-size:1.5rem}
  .credit:not(.on){display:none}
  /* the couple's way in: two small rings in the top corner. Guests read it
     as decoration; the couple know it opens their guest list (behind a code) */
  .gm-dot{position:absolute;top:10px;right:10px;left:auto;z-index:5;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.55);border:1px solid var(--line);
    color:var(--gold);opacity:.6;transition:opacity .35s,visibility .35s}
  .gm-dot svg{width:14px;height:14px;overflow:visible}
  .gm-dot .r2{animation:gmRing 8s ease-in-out infinite;transform-origin:15px 13px}
  .gm-dot:hover,.gm-dot:focus-visible{opacity:1;border-color:var(--gold);outline:none}
  .gm-dot.away{opacity:0;visibility:hidden;pointer-events:none}   /* gone as soon as the page moves */
  @keyframes gmRing{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(5deg)}}
  @media (min-width:700px){.gm-dot{top:14px;right:14px;width:30px;height:30px}.gm-dot svg{width:16px;height:16px}}
  @media (prefers-reduced-motion:reduce){.gm-dot .r2{animation:none}}
  .gm-dot[hidden]{display:none}

  [hidden]{display:none!important}

  /* ---- splash / monogram reveal ---- */
  #splash{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);transition:opacity .7s ease;
  }
  #splash.gone{opacity:0;pointer-events:none}
  .monogram{text-align:center;animation:mono-in 1s ease both}
  .monogram .ring{
    width:252px;height:252px;margin:0 auto;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .monogram .mono-img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    animation:wreath-in 1.5s ease .1s both;
  }
  .monogram .wreath{
    position:absolute;inset:0;width:100%;height:100%;
    animation:wreath-in 1.5s ease .1s both;
  }
  .monogram .letters{
    position:relative;direction:rtl;
    font-family:"David Libre","Frank Ruhl Libre",serif;color:var(--sage-deep);
    font-size:3.6rem;font-weight:400;line-height:1;
    display:flex;align-items:center;gap:.34em;
  }
  .monogram .letters .gem{
    width:8px;height:8px;background:var(--gold);opacity:.85;
    transform:rotate(45deg);flex:none;
  }
  @keyframes wreath-in{from{opacity:0;transform:rotate(-6deg) scale(.94)}to{opacity:1;transform:none}}
  .monogram .sub{
    margin-top:18px;font-family:"Cormorant Garamond",serif;font-style:italic;
    color:var(--sage);font-size:1.15rem;letter-spacing:.08em;
    opacity:0;animation:sub-in .8s ease .35s both;
  }
  @keyframes mono-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes sub-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* ---- soft botanical watercolour splashes behind the interactive text ---- */
  .card-body::before,.card-body::after{
    content:"";position:absolute;z-index:-1;pointer-events:none;
    width:290px;height:290px;border-radius:48% 52% 61% 39% / 43% 38% 62% 57%;
    background:
      radial-gradient(circle at 34% 36%, rgba(116,139,88,.20) 0 18%, transparent 47%),
      radial-gradient(circle at 64% 52%, rgba(85,111,69,.14) 0 20%, transparent 52%),
      radial-gradient(circle at 47% 72%, rgba(154,167,116,.13) 0 15%, transparent 48%);
    filter:blur(9px);opacity:.9;
  }
  .card-body::before{left:-145px;top:48px;transform:rotate(-18deg)}
  .card-body::after{right:-150px;top:500px;transform:rotate(28deg)}
  .text-splash{
    position:absolute;z-index:-1;pointer-events:none;width:240px;height:170px;
    border-radius:54% 46% 64% 36% / 46% 61% 39% 54%;
    background:radial-gradient(ellipse at center, rgba(111,137,79,.15), rgba(111,137,79,.06) 45%, transparent 72%);
    filter:blur(7px);
  }
  .splash-one{right:-95px;top:245px;transform:rotate(-12deg)}
  .splash-two{left:-105px;top:835px;transform:rotate(17deg)}

  /* ---- calendar actions ---- */
  .calendar-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
  .calendar-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-width:176px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
    color:var(--sage-deep);background:rgba(253,250,243,.78);text-decoration:none;
    font-size:.98rem;transition:.2s;backdrop-filter:blur(3px)
  }
  .calendar-btn:hover{border-color:var(--sage);background:rgba(127,138,95,.12);transform:translateY(-1px)}
  .calendar-btn svg{width:16px;height:16px;flex:none}
  @media(max-width:640px){
    .calendar-btn{min-width:150px;flex:1 1 150px}
    .splash-one{right:-130px}.splash-two{left:-130px}
  }
</style>
</head>
<body>
<!-- Dudaim mark for a second, then the couple's own opening (source: dudaim repo, loader/dudaim-loader.html) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap">
<style>
  html.dl-lock { overflow: hidden; }
  #dudaim-loader {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #F8F6F0; font-family: "Cormorant Garamond", Georgia, serif;
  }

  /* the ending: lift, open, dissolve */
  #dudaim-loader.dl-exit { animation: dl-out .9s cubic-bezier(.4,0,.2,1) .35s forwards; pointer-events: none; }
  #dudaim-loader.dl-exit .dl-plant,
  #dudaim-loader.dl-exit .dl-word { animation: dl-rise .7s cubic-bezier(.4,0,.2,1) forwards; }
  #dudaim-loader.dl-exit .dl-word { animation-delay: .05s; }
  #dudaim-loader.dl-exit .dl-rule i { animation: dl-horizon 1.1s cubic-bezier(.3,0,.2,1) forwards; }
  #dudaim-loader.dl-exit .dl-rule b { animation: dl-dia-out .5s ease forwards; }
  @keyframes dl-out     { to { opacity: 0; visibility: hidden; } }
  @keyframes dl-rise    { to { opacity: 0; transform: translateY(-14px); filter: blur(3px); } }
  @keyframes dl-horizon { 0% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(7); opacity: 0; } }
  @keyframes dl-dia-out { from { opacity: .85; transform: rotate(45deg) scale(1); } to { opacity: 0; transform: rotate(45deg) scale(.3); } }

  #dudaim-loader .dl-plant { width: 260px; height: 195px; max-width: 60vw; }
  #dudaim-loader .dl-word {
    font-size: 64px; font-weight: 500; letter-spacing: .16em; padding-left: .16em;
    line-height: 1; color: #4F6138; margin-top: 10px; white-space: nowrap;
  }
  @media (max-width: 480px) { #dudaim-loader .dl-word { font-size: 44px; } }

  /* letters write in */
  #dudaim-loader .dl-ltr { display: inline-block; animation: dl-ltr .7s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes dl-ltr { from { opacity: 0; filter: blur(5px); transform: translateY(8px); } to { opacity: 1; filter: blur(0); transform: none; } }

  /* the leaf that sprouts on the i and floats up */
  #dudaim-loader .dl-i { position: relative; }
  #dudaim-loader .dl-seed {
    position: absolute; width: .26em; height: .26em; left: calc(50% - .21em); top: .05em;
    transform-origin: 50% 50%; animation: dl-seed 1.4s cubic-bezier(.5,0,.3,1) 1.2s both;
  }
  @keyframes dl-seed {
    0%   { opacity: 0; transform: scale(0) rotate(-50deg); }
    25%  { opacity: 1; transform: scale(1.1) rotate(18deg); }
    35%  { transform: scale(1) rotate(12deg); }
    50%  { opacity: 1; transform: translateY(0) scale(1) rotate(12deg); }
    100% { opacity: 0; transform: translateY(-110px) scale(.7) rotate(-8deg); }
  }
  /* gold diamond that becomes the dot of the i */
  #dudaim-loader .dl-tittle {
    position: absolute; width: .085em; height: .085em; left: calc(50% - .123em); top: .17em;
    background: #A68B4C; animation: dl-dia .45s ease-out 2.3s both;
  }
  @keyframes dl-dia { from { opacity: 0; transform: rotate(45deg) scale(0); } to { opacity: .85; transform: rotate(45deg) scale(1); } }

  /* leaves draw themselves */
  @property --dl-veins { syntax: "<number>"; inherits: true; initial-value: 1; }
  #dudaim-loader .dl-grow { stroke-dasharray: 1; animation: dl-draw 1.1s cubic-bezier(.45,0,.25,1) both; }
  @keyframes dl-draw {
    0%   { stroke-dashoffset: 1; opacity: 0; --dl-veins: 0; }
    6%   { opacity: 1; }
    65%  { --dl-veins: 0; }
    100% { stroke-dashoffset: 0; opacity: 1; --dl-veins: 1; }
  }

  /* fruits pop in, then breathe while loading */
  #dudaim-loader .dl-pop {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: dl-pop .6s cubic-bezier(.3,1.5,.5,1) both, dl-breathe 2.6s ease-in-out 4.2s infinite alternate;
  }
  @keyframes dl-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes dl-breathe { from { transform: scale(1); } to { transform: scale(1.04); } }

  /* the thin rule with the gold diamond */
  #dudaim-loader .dl-rule { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  #dudaim-loader .dl-rule i { display: block; width: 54px; height: 1px; background: #DCDBD3; animation: dl-line .8s cubic-bezier(.4,0,.2,1) 3.3s both; }
  #dudaim-loader .dl-rule i:first-child { transform-origin: right center; }
  #dudaim-loader .dl-rule i:last-child  { transform-origin: left center; }
  #dudaim-loader .dl-rule b { display: block; width: 6px; height: 6px; background: #A68B4C; animation: dl-dia .45s ease-out 3.7s both; }
  @keyframes dl-line { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* the quick version: the finished mark, softly, in about a second */
  #dudaim-loader.dl-quick .dl-plant *,
  #dudaim-loader.dl-quick .dl-word *,
  #dudaim-loader.dl-quick:not(.dl-exit) .dl-rule > * { animation-delay: 0s !important; animation-duration: .55s !important; }
  #dudaim-loader.dl-quick .dl-seed { display: none; }
  #dudaim-loader.dl-quick .dl-pop { animation-iteration-count: 1 !important; }

  @media (prefers-reduced-motion: reduce) {
    #dudaim-loader, #dudaim-loader * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>

<div id="dudaim-loader" role="status" aria-label="Loading" data-min="4200" data-quick>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <filter id="dl-rough"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="2.4"/></filter>
      <g id="dl-leaf" style="fill:#F8F6F0;stroke:#4F6138;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round">
        <path pathLength="1" d="M0 0 C-8 -10 -16 -18 -14 -30 C-18 -36 -16 -44 -12 -50 C-14 -58 -10 -66 -4 -72 C-3 -76 -1 -79 0 -82 C2 -78 4 -74 6 -70 C11 -64 14 -56 12 -50 C16 -43 17 -36 13 -30 C15 -20 9 -10 0 0 Z"/>
        <path pathLength="1" d="M0 -1 C-1 -28 0 -54 0 -78" fill="none"/>
        <path d="M0 -12 Q-6 -18 -10 -26 M0 -12 Q6 -18 10 -26 M0 -28 Q-6 -34 -11 -42 M0 -28 Q6 -34 11 -42 M0 -44 Q-5 -50 -9 -57 M0 -44 Q5 -50 9 -57 M0 -58 Q-3 -63 -5 -68 M0 -58 Q3 -63 5 -68" fill="none" stroke-width="0.9" style="stroke-dasharray:none;opacity:var(--dl-veins,1)"/>
      </g>
    </defs>
  </svg>

  <svg class="dl-plant" viewBox="20 50 160 120" aria-hidden="true">
    <g filter="url(#dl-rough)">
      <use href="#dl-leaf" class="dl-grow" style="animation-delay:2s"   transform="translate(100 150) rotate(-62)"/>
      <use href="#dl-leaf" class="dl-grow" style="animation-delay:2.1s" transform="translate(100 150) rotate(64)"/>
      <use href="#dl-leaf" class="dl-grow" style="animation-delay:2.2s" transform="translate(100 150) rotate(-4)"/>

        <div class="credit-mark" aria-hidden="true"><i></i><span></span><i></i></div>
        <a id="creditLink" target="_blank" rel="noopener">
          <span class="lead" data-t="credit_lead"></span>
          <span class="brand" data-t="credit_brand"></span>
        </a>
      </div>
      </div><!-- /card-body -->
    </div>
  </div>

<script>
/* ============================================================
   1) WHERE THE REPLIES GO
   Paste the Google Apps Script web app URL between the quotes.
   Left empty, the form still works for previewing — replies are
   written to the browser console instead of a spreadsheet.
   ============================================================ */
const ENDPOINT = "";

/* ============================================================
   2) THE WEDDING
   ============================================================ */
const WEDDING = {
  logo: "PASTE_DATA_URI_LOGO",          // the couple's own monogram; "" draws the wreath instead
  monogram: ["א", "ב"],                 // the two letters inside the wreath
  icsName: "first-second-wedding",   // the .ics filename
  start: "20260101T180000",             // first event of the evening, Asia/Jerusalem
  end:   "20260101T235900",
  calTitle: "First & Second Wedding",   // keep it short: first names, the way a guest would write it
  calLocation: "Venue, City, Israel",
  calDetails: "Kabbalat Panim 00:00, Chuppah 00:00."
};

/* The quiet line at the foot of the page. Leave both empty to drop it.
   A WhatsApp number opens a chat with the first line already written, in
   the language the guest was reading; url, when set, wins over it. */
const CREDIT = {
  // ?ref=<the couple's first names> is how the studio counts this wedding's
  // clicks. Keep the query string exactly as it is.
  url: "https://dudaim.netlify.app/?ref=first-second",
  whatsapp: ""          // a number instead, when there is no site to send them to
};

/* The couple's guest list. In the guest manager: Access code → copy the
   secret link and paste it here. The dot under the footer opens it; it asks
   for the access code and shows nothing without it. Empty: no dot. */
const GUESTS_LINK = "";

const DEFAULT_LANG = "en";
const AUTO_DETECT  = true;   // open in the visitor's own language when we have it

/* ============================================================
   3) THE WORDING — one block per language
   ============================================================ */
const T = {
  en:{
    name:"English",
    dir:"ltr",
    date:"WEEKDAY, DAY MONTH YEAR",
    hebdate:"HEBREW DATE",
    venue:"VENUE",
    kabbalat_l:"Kabbalat Panim", chuppah_l:"Chuppah",
    couple:"First & Second",
    seam:"With love, we ask you to reply",
    map_h:"Getting there", map_sub:"VENUE, CITY",
    directions:"Open directions in Waze",
    cal_google:"Add to Google Calendar", cal_apple:"Add to Apple Calendar",
    rsvp_h:"Will you join us?", rsvp_sub:"Kindly reply below",
    name_l:"Full name", name_ph:"Your full name",
    attend_l:"Will you attend?", attend_yes:"Joyfully yes", attend_no:"Sadly no",
    guests_l:"How many guests (including you)?",
    diet_l:"Anything we should know about food? (optional)",
    diet_none:"No restrictions", diet_vegetarian:"Vegetarian", diet_vegan:"Vegan",
    diet_gf:"Gluten free", diet_other:"Something else",
    diet_note_ph:"Tell us what to avoid",
    submit:"Send RSVP",
    thanks_h:"Thank you!", thanks_p:"Your reply has been received. We can't wait to celebrate with you.",
    again:"Send another reply",
    foot:"We can't wait to celebrate with you",
    credit_lead:"Invitation site by", credit_brand:"Dudaim",
    credit_msg:"Hi Dudaim — I saw an invitation site of yours and I'd like one for our wedding",
    err_name:"Please enter your name.",
    err_attend:"Please let us know if you'll attend.",
    sending:"Sending…", fail:"Something went wrong. Please try again."
  },
  he:{
    name:"עברית",
    dir:"rtl",
    date:"יום ..., 00 ב... 2026",
    hebdate:"... ב... תשפ״...",
    venue:"שם המקום",
    kabbalat_l:"קבלת פנים", chuppah_l:"חופה",
    couple:"שם ושם",
    seam:"נשמח לאישור הגעתכם",
    map_h:"איך מגיעים", map_sub:"שם המקום, יישוב",
    directions:"פתחו ניווט ב-Waze",
    cal_google:"הוספה ליומן Google", cal_apple:"הוספה ליומן Apple",
    rsvp_h:"תבואו לחגוג איתנו?", rsvp_sub:"נודה לכם על אישור ההגעה",
    name_l:"שם מלא", name_ph:"השם המלא שלכם",
    attend_l:"האם תגיעו?", attend_yes:"בשמחה, מגיעים", attend_no:"לצערנו לא",
    guests_l:"כמה אורחים (כולל אתכם)?",
    diet_l:"משהו שכדאי לדעת לגבי האוכל? (לא חובה)",
    diet_none:"ללא הגבלות", diet_vegetarian:"צמחוני", diet_vegan:"טבעוני",
    diet_gf:"ללא גלוטן", diet_other:"משהו אחר",
    diet_note_ph:"ספרו לנו ממה להימנע",
    submit:"שליחת אישור",
    thanks_h:"תודה רבה!", thanks_p:"אישור ההגעה התקבל. מחכים לחגוג איתכם!",
    again:"שליחת אישור נוסף",
    foot:"מחכים לחגוג איתכם",
    credit_lead:"עוצב על ידי", credit_brand:"דודאים",
    credit_msg:"היי דודאים — ראיתי אתר הזמנה שלכם ואשמח לאחד לחתונה שלנו",
    err_name:"נא להזין שם.",
    err_attend:"נא לציין אם תגיעו.",
    sending:"שולח…", fail:"משהו השתבש. נסו שוב בבקשה."
  }
};

/* ============================================================
   4) THE PRINTED INVITATION, one image per language.
   A language with no image of its own shows the default one.
   ============================================================ */
const INVITE_IMG = {
  en: "PASTE_DATA_URI_EN",
  he: "PASTE_DATA_URI_HE"
};
/* Don't paste these by hand — run, from this folder:
     python3 embed-images.py path/to/index.html en=invite-en.jpg he=invite-he.jpg
   It writes each image into the file as a data URI. */

/* ============================================================
   The machinery. Nothing below needs editing.
   ============================================================ */
let lang = DEFAULT_LANG, attend = null;

function applyLang(l, animate){
  if (animate){
    const card = document.querySelector(".card");
    card.classList.add("swapping");
    setTimeout(()=>{ paintLang(l); card.classList.remove("swapping"); }, 220);
    return;
  }
  paintLang(l);
}

function paintLang(l){
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = t.dir;
  document.body.classList.toggle("rtl", t.dir === "rtl");
  const img = document.getElementById("inviteImg");
  if (img) img.src = INVITE_IMG[l] || INVITE_IMG[DEFAULT_LANG] || Object.values(INVITE_IMG)[0];
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    if (t[k] !== undefined) el.textContent = t[k];
  });
  document.querySelectorAll("[data-ph]").forEach(el=>{
    el.placeholder = t[el.getAttribute("data-ph")] || "";
  });
  const dot = document.getElementById("gmDot");
  if (dot && GUESTS_LINK && dot.hidden){
    dot.href = GUESTS_LINK; dot.hidden = false;
    const away = () => dot.classList.toggle("away", window.scrollY > 24);
    window.addEventListener("scroll", away, { passive: true }); away();
  }
  const credit = document.getElementById("creditLink");
  if (credit){
    const href = CREDIT.url || chatHref(t);
    credit.href = href;
    credit.closest(".credit").classList.toggle("on", !!href);
  }
  document.querySelectorAll(".langbar button").forEach(b=>b.classList.toggle("on", b.dataset.lang === l));
  try { localStorage.setItem("rsvp-lang", l); } catch(e){}
}

function chatHref(t){
  if (!CREDIT.whatsapp) return "";
  return "https://wa.me/" + CREDIT.whatsapp + "?text=" + encodeURIComponent(t.credit_msg || "");
}

/* the switcher builds itself from T, and hides when there is only one language */
(function buildLangbar(){
  const bar = document.getElementById("langbar");
  const codes = Object.keys(T);
  if (codes.length < 2) return;
  bar.classList.add("multi");
  codes.forEach(code=>{
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.lang = code;
    b.textContent = T[code].name;
    b.addEventListener("click", ()=>applyLang(code, true));
    bar.appendChild(b);
  });
})();

function chooseLang(){
  const codes = Object.keys(T);
  const asked = new URLSearchParams(location.search).get("lang");
  if (asked && codes.includes(asked)) return asked;
  let saved = null;
  try { saved = localStorage.getItem("rsvp-lang"); } catch(e){}
  if (saved && codes.includes(saved)) return saved;
  if (AUTO_DETECT){
    for (const pref of (navigator.languages || [navigator.language || ""])){
      const hit = codes.find(c => pref.toLowerCase().startsWith(c));
      if (hit) return hit;
    }
  }
  return codes.includes(DEFAULT_LANG) ? DEFAULT_LANG : codes[0];
}

/* every invitation is decoded up front, so a swap has nothing to wait for,
   and the first one to arrive fixes the frame's proportions */
(function prepareInvitations(){
  const figure = document.querySelector(".invite-img");
  let measured = false;
  Object.values(INVITE_IMG).forEach(src=>{
    const probe = new Image();
    probe.onload = function(){
      if (measured || !probe.naturalWidth) return;
      measured = true;
      figure.style.setProperty("--invite-ratio", probe.naturalWidth + " / " + probe.naturalHeight);
    };
    probe.src = src;
  });
})();

/* the opening monogram: hold ~1.5s, then fade into the invitation */
(function splash(){
  const SHOW_MS = 1500;
  /* a monogram of their own replaces the drawn wreath and its letters */
  if (WEDDING.logo && WEDDING.logo.indexOf("PASTE_") !== 0){
    const img = document.getElementById("monoImg");
    img.src = WEDDING.logo;
    img.hidden = false;
    document.querySelector(".monogram .wreath").remove();
    document.querySelector(".monogram .letters").remove();
  } else {
    document.getElementById("monoA").textContent = WEDDING.monogram[0];
    document.getElementById("monoB").textContent = WEDDING.monogram[1];
  }
  function open(){
    setTimeout(function(){
      const s = document.getElementById("splash");
      if (s){ s.classList.add("gone"); setTimeout(()=>s.remove(), 800); }
    }, SHOW_MS);
  }
  /* the Dudaim mark plays first; the monogram's time starts when it lifts */
  window.addEventListener("load", function(){
    if (window.dudaimLoader && !window.dudaimLoader.done) document.addEventListener("dudaim-loader-done", open, { once: true });
    else open();
  });
})();

/* attend selection */
document.querySelectorAll("#attend label").forEach(l=>{
  l.addEventListener("click", ()=>{
    attend = l.dataset.attend;
    document.querySelectorAll("#attend label").forEach(x=>x.classList.toggle("on", x === l));
    const w = document.getElementById("comingWrap");
    if (attend === "yes"){ w.classList.remove("hide"); w.classList.add("show"); }
    else {
      w.classList.remove("show"); w.classList.add("hide");
      const dn = document.getElementById("dietNoteWrap");
      dn.classList.remove("show"); dn.classList.add("hide");
      document.getElementById("diet").value = "none";
      document.getElementById("dietNote").value = "";
    }
  });
});

/* "something else" opens a line to write in */
document.getElementById("diet").addEventListener("change", function(){
  const w = document.getElementById("dietNoteWrap");
  const wanted = this.value === "other";
  w.classList.toggle("show", wanted);
  w.classList.toggle("hide", !wanted);
  if (wanted) document.getElementById("dietNote").focus();
  else document.getElementById("dietNote").value = "";
});

const msg = document.getElementById("msg");
const btn = document.getElementById("submitBtn");

btn.addEventListener("click", async ()=>{
  const t = T[lang];
  const name = document.getElementById("fullname").value.trim();
  msg.className = "msg";
  if (!name){ msg.textContent = t.err_name; msg.classList.add("err"); return; }
  if (!attend){ msg.textContent = t.err_attend; msg.classList.add("err"); return; }

  const payload = {
    name,
    attending: attend === "yes" ? "Yes" : "No",
    guests: attend === "yes" ? document.getElementById("guests").value : "0",
    diet: attend === "yes" ? document.getElementById("diet").value : "",
    dietNote: attend === "yes" ? document.getElementById("dietNote").value.trim() : "",
    language: lang,
    timestamp: new Date().toISOString()
  };

  if (!ENDPOINT){
    console.log("RSVP (endpoint not set):", payload);
    showThanks();
    return;
  }

  btn.disabled = true;
  msg.textContent = t.sending; msg.classList.remove("err"); msg.classList.add("ok");
  try{
    await fetch(ENDPOINT, {
      method:"POST",
      mode:"no-cors",                 // Apps Script needs this
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    showThanks();
  }catch(e){
    console.error(e);
    msg.textContent = t.fail; msg.classList.remove("ok"); msg.classList.add("err");
  }finally{
    btn.disabled = false;
  }
});

function showThanks(){
  document.getElementById("formArea").hidden = true;
  document.getElementById("thanks").classList.add("show");
  msg.textContent = "";
}

document.getElementById("againBtn").addEventListener("click", ()=>{
  document.getElementById("thanks").classList.remove("show");
  document.getElementById("formArea").hidden = false;
  document.getElementById("fullname").value = "";
  attend = null;
  document.querySelectorAll("#attend label").forEach(x=>x.classList.remove("on"));
  const w = document.getElementById("comingWrap"); w.classList.remove("show"); w.classList.add("hide");
  document.getElementById("guests").value = "1";
  document.getElementById("diet").value = "none";
  document.getElementById("dietNote").value = "";
  const dn = document.getElementById("dietNoteWrap"); dn.classList.remove("show"); dn.classList.add("hide");
  document.querySelectorAll('input[name="attend"]').forEach(i=>i.checked = false);
});

/* calendar links */
(function setupCalendars(){
  const g = document.getElementById("googleCalendar");
  if (g){
    g.href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
      action:"TEMPLATE",
      text: WEDDING.calTitle,
      dates: WEDDING.start + "/" + WEDDING.end,
      ctz:"Asia/Jerusalem",
      details: WEDDING.calDetails,
      location: WEDDING.calLocation
    }).toString();
  }

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Wedding//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:" + WEDDING.icsName + "@wedding",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z"),
    "DTSTART;TZID=Asia/Jerusalem:" + WEDDING.start,
    "DTEND;TZID=Asia/Jerusalem:" + WEDDING.end,
    "SUMMARY:" + WEDDING.calTitle,
    "LOCATION:" + WEDDING.calLocation,
    "DESCRIPTION:" + WEDDING.calDetails,
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n") + "\r\n";

  const a = document.getElementById("appleCalendar");
  if (a){
    a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"}));
    a.download = WEDDING.icsName + ".ics";
  }
})();

applyLang(chooseLang());
</script>
</body>
</html>
