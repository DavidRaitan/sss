<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COUPLE — RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Frank+Ruhl+Libre:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Taken from the invitation itself: its paper, its ink, the olive of the
     leaves and the peach of the chuppah drape. */
  :root{
    --ink:#332f22;
    --ink-soft:#5c5745;
    --sage:#7f8a5f;
    --sage-deep:#55603c;
    --gold:#c9a077;
    --paper:#f6f1e6;
    --line:#e2dbc8;
    --white:#fdfaf3;
    --shadow:0 18px 50px -22px rgba(74,64,42,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scrollbar-gutter:stable}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"EB Garamond",Georgia,serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body.rtl{direction:rtl}
  body.rtl .sec,body.rtl .submit,body.rtl .thanks h3{font-family:"Frank Ruhl Libre",serif}

  /* ---- botanical frame ---- */
  .leaves{position:fixed;pointer-events:none;z-index:0;opacity:.4}
  .leaves svg{display:block}
  .leaf-tl{top:-40px;left:-40px}
  .leaf-br{bottom:-50px;right:-45px;transform:rotate(180deg)}
  @media(max-width:640px){.leaves{opacity:.55;transform:scale(.7)}.leaf-tl{top:-70px;left:-70px}.leaf-br{bottom:-80px;right:-75px}}

  .wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:34px 20px 70px}

  /* ---- language switch ---- */
  .langbar{display:flex;justify-content:center;gap:6px;margin-bottom:28px;direction:ltr}
  .langbar button{
    font-family:"EB Garamond",serif;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    padding:7px 15px;border-radius:999px;cursor:pointer;transition:.25s;
  }
  .langbar button.on{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--white)}
  .langbar button:hover:not(.on){border-color:var(--sage);color:var(--sage-deep)}
  .langbar:not(.multi){display:none}

  /* ---- card ---- */
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:4px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;padding:0 0 40px;
  }
  .card-body{padding:0 40px;position:relative;isolation:isolate;overflow:hidden}
  @media(max-width:640px){.card-body{padding:0 22px}}

  /* ---- the invitation itself ---- */
  .invite-img{margin:0;line-height:0;background:var(--white);aspect-ratio:var(--invite-ratio,2/3)}
  .invite-img img{width:100%;height:100%;object-fit:contain;display:block}

  /* the language swap: one quiet crossfade, no jump */
  .invite-img img,.card-body{transition:opacity .22s ease}
  .card.swapping .invite-img img,.card.swapping .card-body{opacity:0}

  /* seam that blends the printed invitation into the interactive part */
  .fade-seam{position:relative;text-align:center;margin:0 0 22px}
  .fade-seam::before{
    content:"";position:absolute;left:0;right:0;top:-70px;height:70px;
    background:linear-gradient(to bottom, rgba(253,250,243,0), var(--white));
    pointer-events:none;
  }
  .fade-seam span{
    position:relative;display:inline-block;margin-top:14px;
    font-style:italic;color:var(--sage);font-size:1.02rem;letter-spacing:.02em;padding:0 14px;
  }
  .fade-seam span::before,.fade-seam span::after{
    content:"";position:absolute;top:50%;width:34px;height:1px;background:var(--line);
  }
  .fade-seam span::before{right:100%}
  .fade-seam span::after{left:100%}

  .facts{text-align:center;margin:24px auto 4px;max-width:420px}
  .facts p{font-size:1.05rem;color:var(--ink-soft);margin:3px 0}
  .facts .big{color:var(--ink);font-size:1.15rem;letter-spacing:.02em}

  .rule{width:56px;height:1px;background:var(--gold);margin:26px auto;opacity:.7}

  .times{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin:20px 0 6px}
  .times div{text-align:center}
  .times .lab{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin-bottom:2px}
  .times .val{font-family:"Cormorant Garamond",serif;font-size:1.7rem;color:var(--ink)}

  h2.sec{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.6rem;color:var(--sage-deep);text-align:center;margin:14px 0 4px}
  .sec-sub{text-align:center;color:var(--ink-soft);font-size:.98rem;margin-bottom:20px}

  /* ---- map ---- */
  .mapblock{margin-top:8px}
  .mapframe{border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:0 8px 24px -16px rgba(74,64,42,.45)}
  .mapframe iframe{display:block;width:100%;height:260px;border:0;filter:saturate(.92)}
  .maplink{display:inline-flex;align-items:center;gap:7px;margin-top:12px;color:var(--sage-deep);font-size:1rem;text-decoration:none;border-bottom:1px solid transparent;transition:.2s}
  .maplink:hover{border-bottom-color:var(--sage-deep)}
  .maplink svg{flex:none}
  .maprow{text-align:center}

  /* ---- form ---- */
  .field{margin-bottom:18px}
  .field label{display:block;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
  .field input,.field select{
    width:100%;font-family:"EB Garamond",serif;font-size:1.05rem;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:12px 14px;transition:.2s;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--sage);background:var(--white);box-shadow:0 0 0 3px rgba(127,138,95,.18)}

  .attend{display:flex;gap:12px}
  .attend label{flex:1;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:3px;padding:14px 8px;transition:.2s;background:var(--paper);font-size:1.05rem;color:var(--ink)}
  .attend input{position:absolute;opacity:0;pointer-events:none}
  .attend label.yes.on{border-color:var(--sage-deep);background:rgba(127,138,95,.16);color:var(--sage-deep);font-weight:600}
  .attend label.no.on{border-color:#c99a77;background:rgba(201,154,119,.15);color:#96684a;font-weight:600}

  .reveal{transition:.3s;overflow:hidden}
  .reveal.hide{max-height:0;opacity:0;margin:0}
  .reveal.show{max-height:340px;opacity:1}

  .submit{
    width:100%;font-family:"Cormorant Garamond",serif;font-size:1.3rem;letter-spacing:.03em;
    background:var(--sage-deep);color:var(--white);border:none;border-radius:3px;padding:15px;cursor:pointer;transition:.25s;margin-top:6px;
  }
  body.rtl .submit{font-size:1.1rem}
  .submit:hover{background:#454f2e}
  .submit:disabled{opacity:.6;cursor:wait}

  .msg{text-align:center;margin-top:16px;font-size:1.02rem;min-height:1.2em}
  .msg.ok{color:var(--sage-deep)}
  .msg.err{color:#a05a3c}

  .thanks{text-align:center;padding:20px 0 6px;display:none}
  .thanks.show{display:block}
  .thanks .mark{font-size:2.4rem;color:var(--gold);font-family:"Cormorant Garamond",serif}
  .thanks h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.7rem;color:var(--sage-deep);margin:6px 0}
  .thanks p{color:var(--ink-soft)}
  .thanks button{margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:9px 18px;border-radius:999px;cursor:pointer;font-family:"EB Garamond",serif;font-size:.9rem;transition:.2s}
  .thanks button:hover{border-color:var(--sage);color:var(--sage-deep)}

  .foot{text-align:center;color:var(--sage);font-style:italic;font-size:1rem;margin-top:30px}

  .credit{text-align:center;margin-top:26px}
  .credit a{
    display:inline-block;color:var(--ink-soft);opacity:.72;text-decoration:none;
    font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;
    padding-bottom:3px;border-bottom:1px solid var(--line);transition:.25s;
  }
  .credit a:hover{opacity:1;color:var(--sage-deep);border-bottom-color:var(--sage)}
  .credit:not(.on){display:none}

  [hidden]{display:none!important}

  /* ---- splash / monogram reveal ---- */
  #splash{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);transition:opacity .7s ease;
  }
  #splash.gone{opacity:0;pointer-events:none}
  .monogram{text-align:center;animation:mono-in 1s ease both}
  .monogram .ring{
    width:190px;height:190px;border-radius:50%;border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;
  }
  .monogram .ring::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(124,138,99,.4)}
  .monogram .letters{
    font-family:"Cormorant Garamond",serif;color:var(--sage-deep);
    font-size:3.1rem;font-weight:500;letter-spacing:.02em;line-height:1;
    display:flex;align-items:center;gap:8px;direction:ltr;
  }
  .monogram .letters .amp{font-style:italic;color:var(--gold);font-size:2rem}
  .monogram .sub{
    margin-top:18px;font-family:"Cormorant Garamond",serif;font-style:italic;
    color:var(--sage);font-size:1.15rem;letter-spacing:.08em;
    opacity:0;animation:sub-in .8s ease .35s both;
  }
  @keyframes mono-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes sub-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* ---- soft botanical watercolour splashes behind the interactive text ---- */
  .card-body::before,.card-body::after{
    content:"";position:absolute;z-index:-1;pointer-events:none;
    width:290px;height:290px;border-radius:48% 52% 61% 39% / 43% 38% 62% 57%;
    background:
      radial-gradient(circle at 34% 36%, rgba(116,139,88,.20) 0 18%, transparent 47%),
      radial-gradient(circle at 64% 52%, rgba(85,111,69,.14) 0 20%, transparent 52%),
      radial-gradient(circle at 47% 72%, rgba(154,167,116,.13) 0 15%, transparent 48%);
    filter:blur(9px);opacity:.9;
  }
  .card-body::before{left:-145px;top:48px;transform:rotate(-18deg)}
  .card-body::after{right:-150px;top:500px;transform:rotate(28deg)}
  .text-splash{
    position:absolute;z-index:-1;pointer-events:none;width:240px;height:170px;
    border-radius:54% 46% 64% 36% / 46% 61% 39% 54%;
    background:radial-gradient(ellipse at center, rgba(111,137,79,.15), rgba(111,137,79,.06) 45%, transparent 72%);
    filter:blur(7px);
  }
  .splash-one{right:-95px;top:245px;transform:rotate(-12deg)}
  .splash-two{left:-105px;top:835px;transform:rotate(17deg)}

  /* ---- calendar actions ---- */
  .calendar-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
  .calendar-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-width:176px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
    color:var(--sage-deep);background:rgba(253,250,243,.78);text-decoration:none;
    font-size:.98rem;transition:.2s;backdrop-filter:blur(3px)
  }
  .calendar-btn:hover{border-color:var(--sage);background:rgba(127,138,95,.12);transform:translateY(-1px)}
  .calendar-btn svg{width:16px;height:16px;flex:none}
  @media(max-width:640px){
    .calendar-btn{min-width:150px;flex:1 1 150px}
    .splash-one{right:-130px}.splash-two{left:-130px}
  }
</style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="monogram">
      <div class="ring">
        <div class="letters"><span id="monoA">S</span><span class="amp">&amp;</span><span id="monoB">N</span></div>
      </div>
      <div class="sub" id="monoSub">Sara Nava &amp; Natan Yehuda</div>
    </div>
  </div>

  <div class="leaves leaf-tl" aria-hidden="true">
    <svg width="230" height="230" viewBox="0 0 230 230" fill="none">
      <g stroke="#6f8352" stroke-width="1.4" fill="none" opacity=".8">
        <path d="M20 20 C60 55 90 90 120 150"/>
        <path d="M20 20 C55 30 80 55 95 95"/>
        <path d="M20 20 C30 55 45 85 70 130"/>
      </g>
      <g fill="#8ca066" opacity=".85">
        <ellipse cx="52" cy="46" rx="16" ry="7" transform="rotate(38 52 46)"/>
        <ellipse cx="78" cy="72" rx="18" ry="8" transform="rotate(42 78 72)"/>
        <ellipse cx="104" cy="104" rx="20" ry="8.5" transform="rotate(46 104 104)"/>
        <ellipse cx="44" cy="78" rx="15" ry="6.5" transform="rotate(70 44 78)"/>
        <ellipse cx="66" cy="120" rx="17" ry="7" transform="rotate(66 66 120)"/>
      </g>
      <g fill="#5f7742" opacity=".7">
        <ellipse cx="40" cy="34" rx="13" ry="5.5" transform="rotate(30 40 34)"/>
        <ellipse cx="90" cy="90" rx="15" ry="6" transform="rotate(48 90 90)"/>
        <ellipse cx="30" cy="60" rx="12" ry="5" transform="rotate(74 30 60)"/>
      </g>
      <g fill="#b7c79a" opacity=".9">
        <circle cx="120" cy="60" r="3.2"/><circle cx="134" cy="74" r="2.6"/><circle cx="112" cy="86" r="2.8"/>
      </g>
    </svg>
  </div>
  <div class="leaves leaf-br" aria-hidden="true">
    <svg width="230" height="230" viewBox="0 0 230 230" fill="none">
      <g stroke="#6f8352" stroke-width="1.4" fill="none" opacity=".8">
        <path d="M20 20 C60 55 90 90 120 150"/>
        <path d="M20 20 C55 30 80 55 95 95"/>
        <path d="M20 20 C30 55 45 85 70 130"/>
      </g>
      <g fill="#8ca066" opacity=".85">
        <ellipse cx="52" cy="46" rx="16" ry="7" transform="rotate(38 52 46)"/>
        <ellipse cx="78" cy="72" rx="18" ry="8" transform="rotate(42 78 72)"/>
        <ellipse cx="104" cy="104" rx="20" ry="8.5" transform="rotate(46 104 104)"/>
        <ellipse cx="44" cy="78" rx="15" ry="6.5" transform="rotate(70 44 78)"/>
        <ellipse cx="66" cy="120" rx="17" ry="7" transform="rotate(66 66 120)"/>
      </g>
      <g fill="#5f7742" opacity=".7">
        <ellipse cx="40" cy="34" rx="13" ry="5.5" transform="rotate(30 40 34)"/>
        <ellipse cx="90" cy="90" rx="15" ry="6" transform="rotate(48 90 90)"/>
      </g>
      <g fill="#b7c79a" opacity=".9">
        <circle cx="120" cy="60" r="3.2"/><circle cx="134" cy="74" r="2.6"/><circle cx="112" cy="86" r="2.8"/>
      </g>
    </svg>
  </div>

  <div class="wrap">
    <div class="langbar" id="langbar" role="group" aria-label="Language"></div>

    <div class="card">
      <!-- THE INVITATION ITSELF (swaps with language) -->
      <figure class="invite-img">
        <img id="inviteImg" alt="Wedding invitation">
      </figure>

      <div class="card-body">
      <span class="text-splash splash-one" aria-hidden="true"></span>
      <span class="text-splash splash-two" aria-hidden="true"></span>
      <div class="fade-seam"><span data-t="seam"></span></div>

      <!-- practical facts, echoing the invitation -->
      <div class="facts">
        <p class="big" data-t="date"></p>
        <p data-t="hebdate"></p>
        <p data-t="venue"></p>
      </div>
      <div class="times">
        <div><div class="lab" data-t="kabbalat_l"></div><div class="val">00:00</div></div>
        <div><div class="lab" data-t="chuppah_l"></div><div class="val">00:00</div></div>
      </div>

      <div class="calendar-actions" aria-label="Add the wedding to your calendar">
        <a class="calendar-btn" id="googleCalendar" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span data-t="cal_google"></span>
        </a>
        <a class="calendar-btn" id="appleCalendar" download="wedding.ics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span data-t="cal_apple"></span>
        </a>
      </div>

      <div class="rule"></div>

      <!-- MAP -->
      <div class="mapblock">
        <h2 class="sec" data-t="map_h"></h2>
        <p class="sec-sub" data-t="map_sub"></p>
        <div class="mapframe">
          <iframe
            title="Venue map"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q=VENUE+NAME+CITY&z=14&output=embed"></iframe>
        </div>
        <div class="maprow">
          <a class="maplink" target="_blank" rel="noopener"
             href="https://www.waze.com/ul?q=VENUE%20NAME&navigate=yes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            <span data-t="directions"></span>
          </a>
        </div>
      </div>

      <div class="rule"></div>

      <!-- FORM -->
      <div id="formArea">
        <h2 class="sec" data-t="rsvp_h"></h2>
        <p class="sec-sub" data-t="rsvp_sub"></p>

        <div class="field">
          <label data-t="name_l"></label>
          <input type="text" id="fullname" autocomplete="name" data-ph="name_ph">
        </div>

        <div class="field">
          <label data-t="attend_l"></label>
          <div class="attend" id="attend">
            <label class="yes" data-attend="yes"><input type="radio" name="attend" value="yes"><span data-t="attend_yes"></span></label>
            <label class="no" data-attend="no"><input type="radio" name="attend" value="no"><span data-t="attend_no"></span></label>
          </div>
        </div>

        <div class="reveal hide" id="comingWrap">
        <div class="field">
          <label data-t="guests_l"></label>
          <select id="guests">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
            <option value="10">10</option><option value="11">11</option><option value="12">12</option>
          </select>
        </div>

        <div class="field">
          <label data-t="diet_l"></label>
          <select id="diet">
            <option value="none" data-t="diet_none"></option>
            <option value="vegetarian" data-t="diet_vegetarian"></option>
            <option value="vegan" data-t="diet_vegan"></option>
            <option value="gluten-free" data-t="diet_gf"></option>
            <option value="other" data-t="diet_other"></option>
          </select>
        </div>
        </div>

        <button class="submit" id="submitBtn" data-t="submit"></button>
        <p class="msg" id="msg"></p>
      </div>

      <div class="thanks" id="thanks">
        <div class="mark">✽</div>
        <h3 data-t="thanks_h"></h3>
        <p data-t="thanks_p"></p>
        <button id="againBtn" data-t="again"></button>
      </div>

      <p class="foot" data-t="foot"></p>
      <p class="credit"><a id="creditLink" target="_blank" rel="noopener" data-t="credit"></a></p>
      </div><!-- /card-body -->
    </div>
  </div>

<script>
/* ============================================================
   1) WHERE THE REPLIES GO
   Paste the Google Apps Script web app URL between the quotes.
   Left empty, the form still works for previewing — replies are
   written to the browser console instead of a spreadsheet.
   ============================================================ */
const ENDPOINT = "";

/* ============================================================
   2) THE WEDDING
   ============================================================ */
const WEDDING = {
  monogram: ["A", "B"],                 // the two initials on the opening ring
  monogramSub: "First & Second",
  icsName: "first-second-wedding",
  start: "20260101T180000",             // first event of the evening, Asia/Jerusalem
  end:   "20260101T235900",
  calTitle: "First & Second — Wedding",
  calLocation: "Venue, City, Israel",
  calDetails: "Wedding of First & Second. Kabbalat Panim 00:00, Chuppah 00:00."
};

/* the quiet line at the foot of the page. Set url to "" to leave it off. */
const CREDIT = { url: "https://wa.me/972547699701?text=" +
                      encodeURIComponent("Hi Dudaim — I'd like an invitation site like this one") };

const DEFAULT_LANG = "en";
const AUTO_DETECT  = true;   // open in the visitor's own language when we have it

/* ============================================================
   3) THE WORDING — one block per language
   ============================================================ */
const T = {
  en:{
    name:"English",
    dir:"ltr",
    date:"WEEKDAY, DAY MONTH YEAR",
    hebdate:"HEBREW DATE",
    venue:"VENUE",
    kabbalat_l:"Kabbalat Panim", chuppah_l:"Chuppah",
    seam:"With love, we ask you to reply",
    map_h:"Getting there", map_sub:"VENUE, CITY",
    directions:"Open directions in Waze",
    cal_google:"Add to Google Calendar", cal_apple:"Add to Apple Calendar",
    rsvp_h:"Will you join us?", rsvp_sub:"Kindly reply below",
    name_l:"Full name", name_ph:"Your full name",
    attend_l:"Will you attend?", attend_yes:"Joyfully yes", attend_no:"Sadly no",
    guests_l:"How many guests (including you)?",
    diet_l:"Anything we should know about food? (optional)",
    diet_none:"No restrictions", diet_vegetarian:"Vegetarian", diet_vegan:"Vegan",
    diet_gf:"Gluten free", diet_other:"Something else — we'll be in touch",
    submit:"Send RSVP",
    thanks_h:"Thank you!", thanks_p:"Your reply has been received. We can't wait to celebrate with you.",
    again:"Send another reply",
    foot:"We can't wait to celebrate with you",

  },
  he:{

    dir:"rtl",

    directions:"פתחו ניווט ב-Waze",

    rsvp_h:"תבואו לחגוג איתנו?", rsvp_sub:"נודה לכם על אישור ההגעה",

    submit:"שליחת אישור",
    thanks_h:"תודה רבה!", thanks_p:"אישור ההגעה התקבל. מחכים לחגוג איתכם!",
    again:"שליחת אישור נוסף",
    foot:"מחכים לחגוג איתכם",
    credit:"אתר ההזמנה — דודאים · גם לכם",
    err_name:"נא להזין שם.",
    err_attend:"נא לציין אם תגיעו.",
    sending:"שולח…", fail:"משהו השתבש. נסו שוב בבקשה."
  }
};

/* ============================================================
   4) THE PRINTED INVITATION, one image per language.
   A language with no image of its own shows the default one.
   ============================================================ */
const INVITE_IMG = {
  en: "PASTE_DATA_URI_EN",
  he: "PASTE_DATA_URI_HE"
};
/* Don't paste these by hand — run, from this folder:
     python3 embed-images.py path/to/index.html en=invite-en.jpg he=invite-he.jpg
   It writes each image into the file as a data URI. */

/* ============================================================
   The machinery. Nothing below needs editing.
   ============================================================ */
let lang = DEFAULT_LANG, attend = null;

function applyLang(l, animate){
  if (animate){
    const card = document.querySelector(".card");
    card.classList.add("swapping");
    setTimeout(()=>{ paintLang(l); card.classList.remove("swapping"); }, 220);
    return;
  }
  paintLang(l);
}

function paintLang(l){
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = t.dir;
  document.body.classList.toggle("rtl", t.dir === "rtl");
  const img = document.getElementById("inviteImg");
  if (img) img.src = INVITE_IMG[l] || INVITE_IMG[DEFAULT_LANG] || Object.values(INVITE_IMG)[0];
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    if (t[k] !== undefined) el.textContent = t[k];
  });
  document.querySelectorAll("[data-ph]").forEach(el=>{
    el.placeholder = t[el.getAttribute("data-ph")] || "";
  });
  document.querySelectorAll(".langbar button").forEach(b=>b.classList.toggle("on", b.dataset.lang === l));
  try { localStorage.setItem("rsvp-lang", l); } catch(e){}
}

(function setupCredit(){
  const a = document.getElementById("creditLink");
  if (!a || !CREDIT.url) return;
  a.href = CREDIT.url;
  a.parentElement.classList.add("on");
})();

/* the switcher builds itself from T, and hides when there is only one language */
(function buildLangbar(){
  const bar = document.getElementById("langbar");
  const codes = Object.keys(T);
  if (codes.length < 2) return;
  bar.classList.add("multi");
  codes.forEach(code=>{
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.lang = code;
    b.textContent = T[code].name;
    b.addEventListener("click", ()=>applyLang(code, true));
    bar.appendChild(b);
  });
})();

function chooseLang(){
  const codes = Object.keys(T);
  const asked = new URLSearchParams(location.search).get("lang");
  if (asked && codes.includes(asked)) return asked;
  let saved = null;
  try { saved = localStorage.getItem("rsvp-lang"); } catch(e){}
  if (saved && codes.includes(saved)) return saved;
  if (AUTO_DETECT){
    for (const pref of (navigator.languages || [navigator.language || ""])){
      const hit = codes.find(c => pref.toLowerCase().startsWith(c));
      if (hit) return hit;
    }
  }
  return codes.includes(DEFAULT_LANG) ? DEFAULT_LANG : codes[0];
}

/* every invitation is decoded up front, so a swap has nothing to wait for,
   and the first one to arrive fixes the frame's proportions */
(function prepareInvitations(){
  const figure = document.querySelector(".invite-img");
  let measured = false;
  Object.values(INVITE_IMG).forEach(src=>{
    const probe = new Image();
    probe.onload = function(){
      if (measured || !probe.naturalWidth) return;
      measured = true;
      figure.style.setProperty("--invite-ratio", probe.naturalWidth + " / " + probe.naturalHeight);
    };
    probe.src = src;
  });
})();

/* the opening monogram: hold ~1.5s, then fade into the invitation */
(function splash(){
  const SHOW_MS = 1500;
  document.getElementById("monoA").textContent = WEDDING.monogram[0];
  document.getElementById("monoB").textContent = WEDDING.monogram[1];
  document.getElementById("monoSub").textContent = WEDDING.monogramSub;
  window.addEventListener("load", function(){
    setTimeout(function(){
      const s = document.getElementById("splash");
      if (s){ s.classList.add("gone"); setTimeout(()=>s.remove(), 800); }
    }, SHOW_MS);
  });
})();

/* attend selection */
document.querySelectorAll("#attend label").forEach(l=>{
  l.addEventListener("click", ()=>{
    attend = l.dataset.attend;
    document.querySelectorAll("#attend label").forEach(x=>x.classList.toggle("on", x === l));
    const w = document.getElementById("comingWrap");
    if (attend === "yes"){ w.classList.remove("hide"); w.classList.add("show"); }
    else { w.classList.remove("show"); w.classList.add("hide"); }
  });
});

const msg = document.getElementById("msg");
const btn = document.getElementById("submitBtn");

btn.addEventListener("click", async ()=>{
  const t = T[lang];
  const name = document.getElementById("fullname").value.trim();
  msg.className = "msg";
  if (!name){ msg.textContent = t.err_name; msg.classList.add("err"); return; }
  if (!attend){ msg.textContent = t.err_attend; msg.classList.add("err"); return; }

  const payload = {
    name,
    attending: attend === "yes" ? "Yes" : "No",
    guests: attend === "yes" ? document.getElementById("guests").value : "0",
    diet: attend === "yes" ? document.getElementById("diet").value : "",
    language: lang,
    timestamp: new Date().toISOString()
  };

  if (!ENDPOINT){
    console.log("RSVP (endpoint not set):", payload);
    showThanks();
    return;
  }

  btn.disabled = true;
  msg.textContent = t.sending; msg.classList.remove("err"); msg.classList.add("ok");
  try{
    await fetch(ENDPOINT, {
      method:"POST",
      mode:"no-cors",                 // Apps Script needs this
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    showThanks();
  }catch(e){
    console.error(e);
    msg.textContent = t.fail; msg.classList.remove("ok"); msg.classList.add("err");
  }finally{
    btn.disabled = false;
  }
});

function showThanks(){
  document.getElementById("formArea").hidden = true;
  document.getElementById("thanks").classList.add("show");
  msg.textContent = "";
}

document.getElementById("againBtn").addEventListener("click", ()=>{
  document.getElementById("thanks").classList.remove("show");
  document.getElementById("formArea").hidden = false;
  document.getElementById("fullname").value = "";
  attend = null;
  document.querySelectorAll("#attend label").forEach(x=>x.classList.remove("on"));
  const w = document.getElementById("comingWrap"); w.classList.remove("show"); w.classList.add("hide");
  document.getElementById("guests").value = "1";
  document.getElementById("diet").value = "none";
  document.querySelectorAll('input[name="attend"]').forEach(i=>i.checked = false);
});

/* calendar links */
(function setupCalendars(){
  const g = document.getElementById("googleCalendar");
  if (g){
    g.href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
      action:"TEMPLATE",
      text: WEDDING.calTitle,
      dates: WEDDING.start + "/" + WEDDING.end,
      ctz:"Asia/Jerusalem",
      details: WEDDING.calDetails,
      location: WEDDING.calLocation
    }).toString();
  }

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Wedding//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:" + WEDDING.icsName + "@wedding",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z"),
    "DTSTART;TZID=Asia/Jerusalem:" + WEDDING.start,
    "DTEND;TZID=Asia/Jerusalem:" + WEDDING.end,
    "SUMMARY:" + WEDDING.calTitle,
    "LOCATION:" + WEDDING.calLocation,
    "DESCRIPTION:" + WEDDING.calDetails,
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n") + "\r\n";

  const a = document.getElementById("appleCalendar");
  if (a){
    a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"}));
    a.download = WEDDING.icsName + ".ics";
  }
})();

applyLang(chooseLang());
</script>
