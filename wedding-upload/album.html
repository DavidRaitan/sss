<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ — album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap">
<style>
:root{
  --accent:#a68b4c; --bg:#f7f5ec; --surface:#fdfcf6; --surface-2:#efece0;
  --ink:#2f3a2c; --muted:#54634d; --line:#cfd3bd; --sage:#7c8a63;
  --display:"Cormorant Garamond",Georgia,serif; --body:"EB Garamond",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--accent:#c9ad6f; --bg:#1a2118; --surface:#222a1f; --surface-2:#2b3427;
        --ink:#f2efe2; --muted:#a8b394; --line:#3a4433; --sage:#8ca066;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.62 var(--body);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:44px 20px 90px}
header{text-align:center;margin-bottom:34px}
.eyebrow{font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:14px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,8vw,56px);
  margin:0 0 10px;line-height:1.05}
.count{color:var(--muted);margin:0;font-size:18.5px}

/* chart hues: validated for colour-blind separation in BOTH themes
   (green/blue, not the invitation's sage/gold - those failed at DeltaE 6.6) */
:root{ --c-photo:#41722c; --c-video:#466ea8; --meter-bg:#e2e0d2; }
@media (prefers-color-scheme:dark){
  :root{ --c-photo:#6ea34a; --c-video:#5f8fd0; --meter-bg:#333c2e; }
}
.panel{
  display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:22px 24px;margin:26px 0 6px;
}
@media (max-width:620px){ .panel{grid-template-columns:1fr;gap:18px;justify-items:center} }
.donut{position:relative;width:168px;height:168px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .hole{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
}
.donut .hole .big{
  font-family:var(--display);font-size:31px;line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.donut .hole .sm{font-size:13px;color:var(--muted);margin-top:3px;letter-spacing:.08em;
  text-transform:uppercase}
.panel-right{width:100%;min-width:0}
.legend{display:flex;flex-direction:column;gap:9px;margin:0 0 16px}
.legend .row{display:flex;align-items:center;gap:10px;font-size:16px}
.legend .dot{width:11px;height:11px;border-radius:3px;flex:none}
.legend .nm{color:var(--ink)}
.legend .vl{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile-s{background:var(--surface-2);border-radius:12px;padding:11px 13px}
.tile-s b{display:block;font-family:var(--display);font-size:25px;line-height:1.1;
  font-variant-numeric:tabular-nums}
.tile-s span{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.meter{margin-top:16px}
.meter .bar{height:8px;border-radius:99px;background:var(--meter-bg);overflow:hidden;display:flex}
.meter .seg{height:100%}
.meter .seg + .seg{box-shadow:-2px 0 0 var(--surface)}
.meter .cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);
  margin-top:7px;font-variant-numeric:tabular-nums}
/* one live meter per Drive the album lives on */
.drive{margin-top:16px}
.drive-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.drive-h b{font-family:var(--display);font-size:20px;font-weight:500}
.recv{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-photo);
  display:inline-flex;align-items:center;gap:6px}
.recv i{width:7px;height:7px;border-radius:50%;background:var(--c-photo);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.drive .bar{height:10px;border-radius:99px;background:var(--meter-bg);overflow:hidden;display:flex}
.drive .seg{height:100%;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.drive .seg.album{background:var(--c-photo)}
.drive .seg.other{background:var(--line)}
.drive .seg + .seg{box-shadow:-2px 0 0 var(--surface)}
.drive .cap{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);
  margin-top:7px;font-variant-numeric:tabular-nums}
.live{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
  letter-spacing:.04em;
}
.live .pip{width:8px;height:8px;border-radius:50%;background:var(--c-photo);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
figure.fresh{animation:pop .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

nav{display:flex;gap:8px;justify-content:center;margin:30px 0 26px}
nav button{
  font:inherit;font-size:17.5px;padding:11px 24px;border-radius:999px;cursor:pointer;
  background:none;border:1px solid var(--line);color:var(--muted);
}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;
  background:var(--surface-2);cursor:zoom-in;transition:transform .18s}
figure:active{transform:scale(.97)}
figure img{width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .4s}
figure img.on{opacity:1}
figure figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;
  font-size:13.5px;color:#fff;
  background:linear-gradient(transparent,rgba(20,26,18,.72));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.vid{position:absolute;top:7px;right:7px;background:rgba(20,26,18,.6);
  border-radius:6px;padding:3px 7px;font-size:12px;color:#fff;letter-spacing:.05em}

.wishes{display:flex;flex-direction:column;gap:12px;max-width:660px;margin:0 auto}
.wish{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px}
.wish p{margin:0 0 10px;font-size:20px;line-height:1.62}
.wish .by{font-size:15px;color:var(--muted);letter-spacing:.02em}
.wish .by b{color:var(--accent);font-weight:600}

.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:19px}
.hide{display:none}
footer{margin-top:50px;text-align:center;color:var(--muted);font-size:14.5px}
.credit{text-align:center;margin-top:30px}
.credit-mark{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.credit-mark i{display:block;width:54px;height:1px;background:var(--line)}
.credit-mark span{display:block;width:6px;height:6px;background:var(--accent);opacity:.8;transform:rotate(45deg)}
.credit a{display:inline-flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;padding:4px 8px;transition:.25s}
.credit .lead{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.credit .brand{font-family:var(--display);font-size:28px;font-weight:500;letter-spacing:.16em;
  color:#4f6138;padding-bottom:4px;border-bottom:1px solid transparent;transition:.25s}
.credit a:hover .brand{border-bottom-color:var(--accent)}
.credit a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}
.credit a[href=""]{display:none}
@media (prefers-color-scheme:dark){ .credit .brand{color:var(--ink)} }
a{color:var(--accent)}

/* ---------- viewer ----------
   Computer: one photo at a time with arrows. Phone: an Instagram-style feed
   you scroll through, where videos play on their own as they come into view. */
.lb{
  position:fixed;inset:0;z-index:60;background:rgba(12,16,11,.95);
  display:none;flex-direction:column;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.lb.on{display:flex}
.lb-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:16px 16px 12px 18px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));color:#f2efe2;flex:none;
}
.lb-id{min-width:0}
.lb-top .who{
  font-family:var(--display);font-size:24px;font-weight:500;color:#fff;
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lb-top .meta{
  font-size:13.5px;color:#a9b699;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lb-title,.lb-cnt{display:none}
.lb-btns{display:flex;align-items:center;gap:9px;flex:none}
.lb-btns a,.lb-btns button{
  width:42px;height:42px;border-radius:999px;display:inline-grid;place-items:center;
  background:rgba(255,255,255,.13);border:none;color:#fff;cursor:pointer;padding:0;
  text-decoration:none;transition:background .15s,transform .15s;
}
.lb-btns a:hover,.lb-btns button:hover{background:rgba(255,255,255,.22)}
.lb-btns a:active,.lb-btns button:active{transform:scale(.92)}
.lb svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.lb-btns .del:hover{background:rgba(208,52,44,.85)}

/* delete: first tap turns the icon into a compact red "Delete?" pill */
.del span{display:none}
.lb .del.confirm{
  background:#d0342c;width:auto;padding:0 15px 0 12px;
  display:inline-flex;align-items:center;gap:6px;
}
.lb .del.confirm span{display:inline;color:#fff;font:600 15px/1 var(--body);white-space:nowrap}
.lb .del.confirm svg{width:17px;height:17px}

.lb-stage{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:0 78px;position:relative;
}
.lb-stage img,.lb-stage video{
  max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;display:block;
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.13);border:none;cursor:pointer;
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;padding:0;
  transition:background .15s,transform .15s;
}
.lb-nav:hover{background:rgba(255,255,255,.24)}
.lb-nav:active{transform:translateY(-50%) scale(.92)}
.lb-nav svg{width:22px;height:22px}
.lb-nav.prev{left:16px} .lb-nav.next{right:16px}
.lb-wish{
  flex:none;margin:0 auto;padding:16px 22px calc(20px + env(safe-area-inset-bottom,0px));
  color:#e8e4d5;font-size:19px;line-height:1.6;text-align:center;max-width:680px;
}
.lb-wish b{color:var(--accent);font-weight:600}
.lb-count{
  font-size:12.5px;letter-spacing:.16em;color:#8d9b7c;text-align:center;
  padding-bottom:10px;flex:none;font-variant-numeric:tabular-nums;
}
.lb-feed{display:none}

/* ---------- phone feed ---------- */
.lb.feed{background:#0c0f0b;-webkit-backdrop-filter:none;backdrop-filter:none}
.lb.feed .lb-top{
  align-items:center;padding:10px 10px 10px 18px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  border-bottom:1px solid rgba(255,255,255,.07);
}
.lb.feed .lb-id,.lb.feed #lbFull,.lb.feed #lbDel,.lb.feed .lb-stage,
.lb.feed .lb-wish,.lb.feed .lb-count{display:none}
.lb.feed .lb-title{display:block;font-family:var(--display);font-size:23px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb.feed .lb-cnt{display:inline;font-size:12.5px;letter-spacing:.12em;color:#8d9b7c;
  font-variant-numeric:tabular-nums;margin-right:4px}
.lb.feed .lb-btns button{background:none;width:40px;height:40px}
.lb.feed .lb-btns svg{width:22px;height:22px}
.lb.feed .lb-feed{
  display:block;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
}
.post{max-width:640px;margin:0 auto 26px}
.post-h{display:flex;align-items:center;gap:11px;padding:12px 14px 10px;text-align:left}
.av{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#6f7f55);color:#fff;
  font:600 15px/1 var(--body);box-shadow:0 0 0 2px #0c0f0b,0 0 0 3.5px var(--accent);
}
.post-who{min-width:0;line-height:1.3}
.post-who b{display:block;color:#fff;font-size:16.5px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-who span{font-size:12.5px;color:#93a184}
.post .media{position:relative;background:#141912;min-height:260px;display:grid;place-items:center}
.post img,.post video{display:block;width:100%;height:auto;max-height:80vh;object-fit:contain}
.post img{opacity:0;transition:opacity .3s}
.post img.on{opacity:1}
.mute{
  position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.55);border:0;display:grid;place-items:center;padding:0;cursor:pointer;
}
.mute svg{width:16px;height:16px}
.post-a{display:flex;align-items:center;gap:2px;padding:6px 8px 0}
.post-a a,.post-a button{
  height:40px;min-width:40px;display:inline-grid;place-items:center;border:0;background:none;
  border-radius:999px;cursor:pointer;padding:0;color:#fff;text-decoration:none;
}
.post-a svg{width:24px;height:24px;stroke:#f2efe2;stroke-width:1.8}
.post-a .del{margin-left:auto}
.post-a .del.confirm{height:34px;margin-right:4px}
.post .wish{margin:2px 14px 0;color:#e8e4d5;font-size:16.5px;line-height:1.5}
.post .wish b{color:#fff;font-weight:600;margin-right:5px}
</style>
</head>
<body>
<!--
  Dudaim loading screen
  ─────────────────────
  HOW TO USE
  1. Paste this whole block right after the opening <body> tag of your page.
  2. That's it. It covers the page while it loads, plays the drawing, then
     lifts away: the plant and the name rise and dissolve, the two hairlines
     open out like a horizon, and the cream fades to reveal the page.

  OPTIONS (attributes on the #dudaim-loader div below)
  • data-speed="1.3"   How fast the drawing plays (1 = the original pace).
  • data-min="4200"    Shortest time it stays up at the original pace, in ms;
                       divided by the speed (4200 / 1.3 ≈ 3.2 s).
  • data-quick         A one-second version: everything appears at once, softly.
                       Used on invitation sites, before the couple's own opening.
  • data-wait="manual" Don't hide on page load; hide it yourself when your data
                       is ready (gallery, RSVP list…) by calling:
                           window.dudaimLoader.hide();
  When it starts to lift it fires a "dudaim-loader-done" event on document,
  so the page's own opening can begin right then.

  The full drawing plays once per visit; moving between pages in the same
  visit shows the quick version. People who turn off motion on their device
  get a still version.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap">
<style>
  html.dl-lock { overflow: hidden; }
  #dudaim-loader {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #F8F6F0; font-family: "Cormorant Garamond", Georgia, serif;
  }

  /* the ending: lift, open, dissolve */
  #dudaim-loader.dl-exit { animation: dl-out .9s cubic-bezier(.4,0,.2,1) .35s forwards; pointer-events: none; }
  #dudaim-loader.dl-exit .dl-plant,
  #dudaim-loader.dl-exit .dl-word { animation: dl-rise .7s cubic-bezier(.4,0,.2,1) forwards; }
  #dudaim-loader.dl-exit .dl-word { animation-delay: .05s; }
  #dudaim-loader.dl-exit .dl-rule i { animation: dl-horizon 1.1s cubic-bezier(.3,0,.2,1) forwards; }
  #dudaim-loader.dl-exit .dl-rule b { animation: dl-dia-out .5s ease forwards; }
  @keyframes dl-out     { to { opacity: 0; visibility: hidden; } }
  @keyframes dl-rise    { to { opacity: 0; transform: translateY(-14px); filter: blur(3px); } }
  @keyframes dl-horizon { 0% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(7); opacity: 0; } }
  @keyframes dl-dia-out { from { opacity: .85; transform: rotate(45deg) scale(1); } to { opacity: 0; transform: rotate(45deg) scale(.3); } }

  #dudaim-loader .dl-plant { width: 260px; height: 195px; max-width: 60vw; }
  #dudaim-loader .dl-word {
    font-size: 64px; font-weight: 500; letter-spacing: .16em; padding-left: .16em;
    line-height: 1; color: #4F6138; margin-top: 10px; white-space: nowrap;
  }
  @media (max-width: 480px) { #dudaim-loader .dl-word { font-size: 44px; } }

  /* letters write in */
  #dudaim-loader .dl-ltr { display: inline-block; animation: dl-ltr .7s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes dl-ltr { from { opacity: 0; filter: blur(5px); transform: translateY(8px); } to { opacity: 1; filter: blur(0); transform: none; } }

  /* the leaf that sprouts on the i and floats up */
  #dudaim-loader .dl-i { position: relative; }
  #dudaim-loader .dl-seed {
    position: absolute; width: .26em; height: .26em; left: calc(50% - .21em); top: .05em;
    transform-origin: 50% 50%; animation: dl-seed 1.4s cubic-bezier(.5,0,.3,1) 1.2s both;
  }
  @keyframes dl-seed {
    0%   { opacity: 0; transform: scale(0) rotate(-50deg); }
    25%  { opacity: 1; transform: scale(1.1) rotate(18deg); }
    35%  { transform: scale(1) rotate(12deg); }
    50%  { opacity: 1; transform: translateY(0) scale(1) rotate(12deg); }
    100% { opacity: 0; transform: translateY(-110px) scale(.7) rotate(-8deg); }
  }
  /* gold diamond that becomes the dot of the i */
  #dudaim-loader .dl-tittle {
    position: absolute; width: .085em; height: .085em; left: calc(50% - .123em); top: .17em;
    background: #A68B4C; animation: dl-dia .45s ease-out 2.3s both;
  }
  @keyframes dl-dia { from { opacity: 0; transform: rotate(45deg) scale(0); } to { opacity: .85; transform: rotate(45deg) scale(1); } }

  /* leaves draw themselves */
  @property --dl-veins { syntax: "<number>"; inherits: true; initial-value: 1; }
  #dudaim-loader .dl-grow { stroke-dasharray: 1; animation: dl-draw 1.1s cubic-bezier(.45,0,.25,1) both; }
  @keyframes dl-draw {
    0%   { stroke-dashoffset: 1; opacity: 0; --dl-veins: 0; }
    6%   { opacity: 1; }
    65%  { --dl-veins: 0; }
    100% { stroke-dashoffset: 0; opacity: 1; --dl-veins: 1; }
  }

  /* fruits pop in, then breathe while loading */
  #dudaim-loader .dl-pop {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: dl-pop .6s cubic-bezier(.3,1.5,.5,1) both, dl-breathe 2.6s ease-in-out 4.2s infinite alternate;
  }
  @keyframes dl-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes dl-breathe { from { transform: scale(1); } to { transform: scale(1.04); } }

  /* the thin rule with the gold diamond */
  #dudaim-loader .dl-rule { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  #dudaim-loader .dl-rule i { display: block; width: 54px; height: 1px; background: #DCDBD3; animation: dl-line .8s cubic-bezier(.4,0,.2,1) 3.3s both; }
  #dudaim-loader .dl-rule i:first-child { transform-origin: right center; }
  #dudaim-loader .dl-rule i:last-child  { transform-origin: left center; }
  #dudaim-loader .dl-rule b { display: block; width: 6px; height: 6px; background: #A68B4C; animation: dl-dia .45s ease-out 3.7s both; }
  @keyframes dl-line { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* the quick version: the finished mark, softly, in about a second */
  #dudaim-loader.dl-quick .dl-plant *,
  #dudaim-loader.dl-quick .dl-word *,
  #dudaim-loader.dl-quick:not(.dl-exit) .dl-rule > * { animation-delay: 0s !important; animation-duration: .55s !important; }
  #dudaim-loader.dl-quick .dl-seed { display: none; }
  #dudaim-loader.dl-quick .dl-pop { animation-iteration-count: 1 !important; }

  @media (prefers-reduced-motion: reduce) {
    #dudaim-loader, #dudaim-loader * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>

<div id="dudaim-loader" role="status" aria-label="Loading" data-min="4200" data-speed="1.3" data-wait="manual">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <filter id="dl-rough"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="2.4"/></filter>
      <g id="dl-leaf" style="fill:#F8F6F0;stroke:#4F6138;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round">

<script>
(function () {
  var el = document.getElementById('dudaim-loader');
  if (!el) return;
  document.documentElement.classList.add('dl-lock');
  var start = performance.now();
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seen = false;
  try { seen = sessionStorage.getItem('dudaim-loader-seen') === '1'; sessionStorage.setItem('dudaim-loader-seen', '1'); } catch (e) {}
  var quick = el.hasAttribute('data-quick') || seen;
  if (quick) el.classList.add('dl-quick');
  var speed = parseFloat(el.getAttribute('data-speed') || '1') || 1;
  var min = reduced ? 300 : quick ? 900 : parseInt(el.getAttribute('data-min') || '4200', 10) / speed;
  // play the drawing a little faster; the ending keeps its own pace
  if (speed !== 1 && !reduced && el.getAnimations) el.getAnimations({ subtree: true }).forEach(function (a) { a.playbackRate = speed; });
  var hidden = false;

  function hide() {
    if (hidden) return;
    hidden = true;
    var wait = Math.max(0, min - (performance.now() - start));
    setTimeout(function () {
      el.classList.add('dl-exit');
      window.dudaimLoader.done = true;
      document.dispatchEvent(new Event('dudaim-loader-done'));
      setTimeout(function () {
        el.remove();
        document.documentElement.classList.remove('dl-lock');
      }, reduced ? 50 : 1300);
    }, wait);
  }

  window.dudaimLoader = { hide: hide, done: false };

  if (el.getAttribute('data-wait') !== 'manual') {
    if (document.readyState === 'complete') hide();
    else window.addEventListener('load', hide);
  }
  // Safety net: never leave a guest stuck on the loader.
  setTimeout(hide, 15000);
})();
</script>

<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const $ = i => document.getElementById(i);
let ITEMS = [];
const WISH_BY_GUEST = {};
let at = -1;

function when(s){
  const d = new Date(s.replace(" ", "T") + "Z");
  return isNaN(d) ? s : d.toLocaleString(undefined,
    {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}

function mb(b){
  b = Number(b || 0);
  if (b >= 1073741824) return (b/1073741824).toFixed(1) + " GB";
  if (b >= 1048576)    return (b/1048576).toFixed(0) + " MB";
  return Math.max(1, Math.round(b/1024)) + " KB";
}

/* Donut drawn with two arcs on one circle: stroke-dasharray in units of the
   circumference (r chosen so it is ~100), and a 2px surface gap between the
   segments so they never blur into one another. */
function drawDonut(st){
  const C = 100, GAP = 1.6;
  const total = st.totalB || 0;
  const pPhoto = total ? st.photoB / total : 0;
  const segs = [
    { el: document.getElementById("ring0"), frac: pPhoto,     color: "var(--c-photo)" },
    { el: document.getElementById("ring1"), frac: 1 - pPhoto, color: "var(--c-video)" },
  ];
  let at = 0;
  for (const sg of segs){
    const len = Math.max(0, sg.frac * C - (sg.frac > 0 && sg.frac < 1 ? GAP : 0));
    sg.el.setAttribute("stroke", sg.color);
    sg.el.setAttribute("stroke-dasharray", len.toFixed(2) + " " + (C - len).toFixed(2));
    sg.el.setAttribute("stroke-dashoffset", (-at).toFixed(2));
    sg.el.setAttribute("stroke-linecap", "butt");
    at += sg.frac * C;
  }
  document.getElementById("dTotal").textContent = mb(total);
  document.getElementById("lgPhoto").textContent =
    st.photoN + (st.photoN === 1 ? " photo · " : " photos · ") + mb(st.photoB);
  document.getElementById("lgVideo").textContent =
    st.videoN + (st.videoN === 1 ? " video · " : " videos · ") + mb(st.videoB);
  document.getElementById("tGuests").textContent = st.guests;
  document.getElementById("tFiles").textContent  = st.photoN + st.videoN;
  document.getElementById("tWishes").textContent = st.wishes;

  drawDrives(st.drives || []);
  document.getElementById("panel").hidden = false;
}

/* A bar per Drive: this album's share (green) and everything else already in
   that account (grey), against its real limit - refreshed with every poll. */
function drawDrives(list){
  const box = document.getElementById("drives");
  for (const d of list) {
    let el = box.querySelector('[data-acct="' + d.acct + '"]');
    if (!el) {
      el = document.createElement("div"); el.className = "drive"; el.dataset.acct = d.acct;
      el.innerHTML = '<div class="drive-h"><b></b><span class="recv" hidden><i></i>Receiving now</span></div>' +
        '<div class="bar"><div class="seg album"></div><div class="seg other"></div></div>' +
        '<div class="cap"><span class="used"></span><span class="free"></span></div>';
      box.appendChild(el);
    }
    el.querySelector("b").textContent = d.label;
    el.querySelector(".recv").hidden = !d.receiving;
    const lim = d.limitB || 0, used = d.usedB == null ? d.albumB : d.usedB;
    const other = Math.max(0, used - d.albumB);
    // a sliver stays visible so a few MB still reads as "something is here"
    const pct = (b) => lim ? Math.max(b > 0 ? 0.6 : 0, 100 * b / lim) : 0;
    el.querySelector(".seg.album").style.width = pct(d.albumB).toFixed(2) + "%";
    el.querySelector(".seg.other").style.width = pct(other).toFixed(2) + "%";
    el.querySelector(".used").textContent = lim
      ? mb(d.albumB) + " of photos · " + (100 * used / lim).toFixed(used / lim < 0.1 ? 1 : 0) + "% of " + mb(lim) + " full"
      : mb(d.albumB) + " of photos";
    el.querySelector(".free").textContent = lim ? mb(Math.max(0, lim - used)) + " free" : "";
  }
}

async function load(refresh){
  const r = await fetch("/api/album?key=" + encodeURIComponent(KEY), {cache:"no-store"});
  if(!r.ok){
    if(!refresh) document.body.innerHTML =
      '<div class="empty" style="padding-top:120px">That link is not valid.</div>';
    return;
  }
  const d = await r.json();
  ITEMS = d.uploads;
  for (const w of d.wishes) {
    const k = (w.guest || "").toLowerCase();
    if (k && !WISH_BY_GUEST[k]) WISH_BY_GUEST[k] = w.message;
  }
  if (d.stats) drawDonut(d.stats);
  if (refresh) { redraw(d); return; }

  $("count").textContent =
    d.uploads.length + (d.uploads.length === 1 ? " photo" : " photos") +
    " · " + d.wishes.length + (d.wishes.length === 1 ? " wish" : " wishes");

  const g = $("grid");
  if(!d.uploads.length){
    // Keep the grid in place so live updates can fill it; just say it's empty.
    $("photos").insertAdjacentHTML("beforeend", '<div class="empty" id="noPhotos">Nothing uploaded yet.</div>');
  } else {
    for(const u of d.uploads) g.appendChild(tileFor(u));
  }

  const w = $("wishes");
  if(!d.wishes.length){
    $("wishesSec").insertAdjacentHTML("beforeend", '<div class="empty" id="noWishes">No wishes yet.</div>');
  } else {
    for(const it of d.wishes) w.appendChild(wishFor(it));
  }
}

function tileFor(u){
  const fig = document.createElement("figure");
  fig.dataset.id = u.drive_id;
  const isVid = (u.mime||"").startsWith("video/");
  fig.innerHTML =
    '<img loading="lazy" alt="">' +
    (isVid ? '<span class="vid">VIDEO</span>' : '') +
    '<figcaption></figcaption>';
  fig.querySelector("figcaption").textContent =
    (u.guest ? u.guest : "A guest") + " · " + when(u.created_at);
  const img = fig.querySelector("img");
  img.onload = () => img.classList.add("on");
  img.src = "/api/thumb?key=" + encodeURIComponent(KEY) + "&id=" + u.drive_id;
  fig.onclick = () => open_(ITEMS.findIndex(x => x.drive_id === u.drive_id));
  return fig;
}

function wishFor(it){
  const el = document.createElement("div");
  el.className = "wish";
  el.dataset.k = (it.guest||"") + "|" + it.created_at;
  const p = document.createElement("p"); p.textContent = it.message;
  const by = document.createElement("div"); by.className = "by";
  const b = document.createElement("b"); b.textContent = it.guest || "A guest";
  by.append(b, document.createTextNode(" · " + when(it.created_at)));
  el.append(p, by); return el;
}

/* ------------------------------------------------------------ viewer ---
   Phone: an Instagram-style feed - scroll through everything; videos play on
   their own, muted, as they come into view (tap for sound). Computer: one photo
   at a time with arrows. */
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const isVid = (u) => (u.mime || "").startsWith("video/");
const mediaUrl = (u) => "/api/media?key=" + encodeURIComponent(KEY) + "&id=" + u.drive_id;
const thumbUrl = (u) => "/api/thumb?key=" + encodeURIComponent(KEY) + "&id=" + u.drive_id + "&s=l";
const wishOf = (u) => WISH_BY_GUEST[(u.guest || "").toLowerCase()];
const ICON = {
  dl: '<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 17v3h16v-3"/></svg>',
  del: '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/></svg>',
  off: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>',
  on:  '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>',
};
let FEED = false, feedObs = null;
const phone = () => matchMedia("(max-width: 820px), (pointer: coarse)").matches;

function postFor(u, i){
  const art = el("article", "post"); art.dataset.i = i; art.dataset.id = u.drive_id;

  const head = el("div", "post-h");
  const av = el("span", "av"); av.textContent = (u.guest || "?").trim().charAt(0).toUpperCase() || "?";
  const who = el("div", "post-who");
  const n = el("b"); n.textContent = u.guest || "A guest";
  const t = el("span"); t.textContent = when(u.created_at);
  who.append(n, t); head.append(av, who);

  const box = el("div", "media");
  if (isVid(u)) {
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = "none";
    v.setAttribute("playsinline", ""); v.setAttribute("muted", "");
    v.poster = thumbUrl(u); v.src = mediaUrl(u);
    const m = el("button", "mute"); m.type = "button"; m.setAttribute("aria-label", "Sound on"); m.innerHTML = ICON.off;
    box.onclick = () => {
      v.muted = !v.muted;
      m.innerHTML = v.muted ? ICON.off : ICON.on;
      m.setAttribute("aria-label", v.muted ? "Sound on" : "Sound off");
      if (v.paused) v.play().catch(() => {});
    };
    v.addEventListener("loadedmetadata", () => setTimeout(syncVideos, 50));
    box.append(v, m);
  } else {
    const img = document.createElement("img");
    img.loading = "lazy"; img.decoding = "async"; img.alt = u.name;
    img.onload = () => img.classList.add("on");
    img.src = thumbUrl(u);
    box.append(img);
  }

  const acts = el("div", "post-a");
  const dl = document.createElement("a");
  dl.href = mediaUrl(u); dl.target = "_blank"; dl.rel = "noopener";
  dl.setAttribute("aria-label", "Open the original"); dl.innerHTML = ICON.dl;
  const del = el("button", "del"); del.type = "button";
  del.setAttribute("aria-label", "Delete"); del.innerHTML = ICON.del + "<span>Delete?</span>";
  del.onclick = (e) => { e.stopPropagation(); remove(u, del); };
  acts.append(dl, del);
  art.append(head, box, acts);

  const w = wishOf(u);
  if (w) {
    const p = el("p", "wish"); const b = el("b"); b.textContent = u.guest || "A guest";
    p.append(b, document.createTextNode(w)); art.append(p);
  }
  return art;
}

function count(i){
  const c = (i + 1) + " / " + ITEMS.length;
  $("lbCount").textContent = c; $("lbCnt").textContent = c;
}

function openFeed(i){
  const feed = $("lbFeed");
  feed.innerHTML = "";
  feedObs = new IntersectionObserver((es) => {
    for (const e of es) if (e.isIntersecting) { at = Number(e.target.dataset.i); count(at); }
  }, { root: feed, rootMargin: "-45% 0px -45% 0px" });
  ITEMS.forEach((u, n) => { const p = postFor(u, n); feed.appendChild(p); feedObs.observe(p); });
  at = i; count(i);
  feed.children[i].scrollIntoView({ block: "start" });
  // Whenever scrolling settles, play the video that is mostly on screen and
  // pause the rest - measured from real positions, so one place decides.
  feed.onscroll = () => { clearTimeout(feed._t); feed._t = setTimeout(syncVideos, 140); };
  setTimeout(syncVideos, 300);
}
function syncVideos(){
  const feed = $("lbFeed"), fr = feed.getBoundingClientRect();
  feed.querySelectorAll("video").forEach((v) => {
    const r = v.getBoundingClientRect();
    const seen = Math.max(0, Math.min(r.bottom, fr.bottom) - Math.max(r.top, fr.top)) / Math.max(1, r.height);
    if (seen >= 0.6) { if (v.paused) v.play().catch(() => {}); }
    else if (!v.paused) v.pause();
  });
}

function showSingle(i){
  if (i < 0 || i >= ITEMS.length) return;
  at = i;
  const u = ITEMS[i];
  $("lbWho").textContent  = u.guest || "A guest";
  $("lbMeta").textContent = u.name + " · " + when(u.created_at) +
    (u.bytes ? " · " + (u.bytes/1048576).toFixed(1) + " MB" : "");
  $("lbFull").href = mediaUrl(u);
  count(i);
  const stage = $("lbStage");
  stage.querySelectorAll("img,video").forEach(n => { n.pause && n.pause(); n.remove(); });
  let m;
  if (isVid(u)) {
    m = document.createElement("video");
    m.controls = true; m.playsInline = true; m.autoplay = true; m.preload = "metadata";
  } else {
    m = document.createElement("img"); m.alt = u.name;
  }
  m.src = mediaUrl(u);                       // full resolution on a big screen
  stage.appendChild(m);
  const w = $("lbWish"), wish = wishOf(u);
  if (wish) {
    w.hidden = false; w.innerHTML = "";
    const b = el("b"); b.textContent = (u.guest || "A guest") + " wrote: ";
    w.append(b, document.createTextNode("“" + wish + "”"));
  } else { w.hidden = true; }
  disarm();
}

function open_(i){
  if (i < 0 || i >= ITEMS.length) return;
  FEED = phone();
  $("lb").classList.toggle("feed", FEED);
  $("lb").classList.add("on");
  document.body.style.overflow = "hidden";
  if (FEED) openFeed(i); else showSingle(i);
}
function close_(){
  $("lb").classList.remove("on");
  if (feedObs) feedObs.disconnect();
  $("lb").querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
  $("lbFeed").innerHTML = "";
  $("lbStage").querySelectorAll("img,video").forEach(n => n.remove());
  document.body.style.overflow = "";
  disarm();
}
function step(d){
  if (!ITEMS.length) return;
  if (FEED) {
    const n = Math.min(ITEMS.length - 1, Math.max(0, at + d));
    const p = $("lbFeed").children[n];
    if (p) p.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    showSingle((at + d + ITEMS.length) % ITEMS.length);
  }
}

/* Two taps to delete, and it goes to the Drive trash rather than vanishing -
   a mis-tap on a wedding photo has to be recoverable. */
let armed = null, armTimer = 0;
function disarm(){
  armed = null; clearTimeout(armTimer);
  document.querySelectorAll(".del.confirm").forEach(b => b.classList.remove("confirm"));
}
async function remove(u, btn){
  if (armed !== btn) {
    disarm(); armed = btn; btn.classList.add("confirm");
    armTimer = setTimeout(disarm, 4000);
    return;
  }
  disarm(); btn.disabled = true;
  try {
    const r = await fetch("/api/delete?key=" + encodeURIComponent(KEY), {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ id: u.drive_id }),
    });
    if (!r.ok) throw new Error("delete failed");
    const fig = document.querySelector('figure[data-id="' + u.drive_id + '"]');
    if (fig) fig.remove();
    const idx = ITEMS.findIndex(x => x.drive_id === u.drive_id);
    if (idx >= 0) ITEMS.splice(idx, 1);
    if (!ITEMS.length) close_();
    else if (FEED) {
      const art = $("lbFeed").querySelector('article[data-id="' + u.drive_id + '"]');
      if (art) { feedObs.unobserve(art); art.remove(); }
      [...$("lbFeed").children].forEach((a, n) => { a.dataset.i = n; });
      count(Math.min(at, ITEMS.length - 1));
    } else showSingle(Math.min(idx, ITEMS.length - 1));
    load(true);                      // refresh the chart and the counts
  } catch (err) {
    if (!FEED) $("lbMeta").textContent = "Could not delete that — try again";
    else btn.closest(".post").querySelector(".post-who span").textContent = "Could not delete — try again";
  } finally {
    btn.disabled = false;
  }
}
$("lbDel").onclick = (e) => { e.stopPropagation(); if (ITEMS[at]) remove(ITEMS[at], $("lbDel")); };
$("lbClose").onclick = close_;
$("lbPrev").onclick = (e) => { e.stopPropagation(); step(-1); };
$("lbNext").onclick = (e) => { e.stopPropagation(); step(1); };
$("lb").onclick = (e) => { if (!FEED && (e.target.id === "lb" || e.target.id === "lbStage")) close_(); };
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("on")) return;
  if (e.key === "Escape") close_();
  if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); step(1); }
});

/* Live: poll for new arrivals and slot them in, rather than reloading and
   throwing away the viewer or the reader's scroll position. */
function redraw(d){
  const g = $("grid");
  const have = new Set([...g.querySelectorAll("figure")].map(f => f.dataset.id));
  const fresh = d.uploads.filter(u => !have.has(u.drive_id));
  for (const u of fresh.reverse()) { const f = tileFor(u); f.classList.add("fresh"); g.prepend(f); }
  if (fresh.length) $("noPhotos")?.remove();

  const w = $("wishes");
  const seen = new Set([...w.querySelectorAll(".wish")].map(e => e.dataset.k));
  for (const it of d.wishes.slice().reverse()){
    const k = (it.guest||"") + "|" + it.created_at;
    if (seen.has(k)) continue;
    w.prepend(wishFor(it));
    $("noWishes")?.remove();
  }
  $("count").textContent =
    d.uploads.length + (d.uploads.length === 1 ? " photo" : " photos") +
    " · " + d.wishes.length + (d.wishes.length === 1 ? " wish" : " wishes");
  if (fresh.length) {
    $("liveTxt").textContent = fresh.length + " just arrived";
    setTimeout(() => { $("liveTxt").textContent = "Live — updating automatically"; }, 4000);
  }
}
setInterval(() => load(true), 7000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(true); });

$("tabPhotos").onclick = () => {
  $("tabPhotos").setAttribute("aria-selected","true");
  $("tabWishes").setAttribute("aria-selected","false");
  $("photos").classList.remove("hide"); $("wishesSec").classList.add("hide");
};
$("tabWishes").onclick = () => {
  $("tabWishes").setAttribute("aria-selected","true");
  $("tabPhotos").setAttribute("aria-selected","false");
  $("wishesSec").classList.remove("hide"); $("photos").classList.add("hide");
};

/* the Dudaim loading screen stays up until the album is ready, then lifts away */
load().catch(() => {}).finally(() => { try { window.dudaimLoader && window.dudaimLoader.hide(); } catch (e) {} });
</script>
